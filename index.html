function importFile(input){
  const f=input.files&&input.files[0];if(!f)return;
  if(/\.xlsx$/i.test(f.name)){
    const msg=$('impMsg');msg.className='msg';msg.textContent='Membaca file Excel...';
    f.arrayBuffer().then(buf=>readXlsx(buf)).then(sheets=>{
      const p=parseSalesBook(sheets,f.name);
      if(!p.months.length)throw new Error('Tidak ada tab bulan (JANUARI–DESEMBER) dengan format yang dikenali.');
      IMP=p;msg.textContent='';renderImport();
    }).catch(e=>{msg.className='msg err';msg.textContent=e.message||'File tidak bisa dibaca.';}).finally(()=>{input.value='';});
  }else importCsv(input);
}

async function readXlsx(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),td=new TextDecoder();
  let e=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error('File bukan Excel (.xlsx) yang valid.');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let k=0;k<n;k++){
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    files[td.decode(u8.subarray(p+46,p+46+nl))]={method,csize,off};p+=46+nl+xl+cl;
  }
  const read=async name=>{
    const f=files[name];if(!f)return null;
    const s=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true),data=u8.subarray(s,s+f.csize);
    if(f.method===0)return td.decode(data);
    if(typeof DecompressionStream==='undefined')throw new Error('Browser ini belum mendukung baca Excel. Perbarui iPadOS/Safari, atau pakai CSV.');
    return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
  const xml=t=>new DOMParser().parseFromString(t,'application/xml');
  const byTag=(d,t)=>Array.from(d.getElementsByTagNameNS('*',t));
  const ss=[];const sst=await read('xl/sharedStrings.xml');
  if(sst)byTag(xml(sst),'si').forEach(si=>ss.push(byTag(si,'t').map(t=>t.textContent).join('')));
  const wb=xml(await read('xl/workbook.xml')),rels=xml(await read('xl/_rels/workbook.xml.rels'));
  const relMap={};byTag(rels,'Relationship').forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const colIdx=ref=>{let c=0;for(const ch of ref.replace(/\d+/g,''))c=c*26+(ch.charCodeAt(0)-64);return c-1;};
  const out=[];
  for(const sh of byTag(wb,'sheet')){
    const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let tgt=relMap[rid];if(!tgt)continue;
    tgt=tgt.startsWith('/')?tgt.slice(1):'xl/'+tgt.replace(/^\.\//,'');
    const t=await read(tgt);if(!t)continue;
    const rows=[];
    byTag(xml(t),'row').forEach(r=>{
      const ri=+r.getAttribute('r')-1,arr=[];
      byTag(r,'c').forEach(c=>{
        const ty=c.getAttribute('t'),v=byTag(c,'v')[0];let val=null;
        if(ty==='s')val=v?ss[+v.textContent]:null;
        else if(ty==='inlineStr')val=byTag(c,'t').map(x=>x.textContent).join('');
        else if(ty==='str'||ty==='e')val=v?v.textContent:null;
        else if(ty==='b')val=v?v.textContent==='1':null;
        else val=v&&v.textContent!==''?Number(v.textContent):null;
        arr[colIdx(c.getAttribute('r'))]=val;
      });
      rows[ri]=arr;
    });
    out.push({name:sh.getAttribute('name'),rows:rows});
  }
  return out;
}

const MONTH_KEYS=[['JANUARI','JAN'],['FEBRUARI','FEB','PEBRUARI'],['MARET','MAR'],['APRIL','APR'],['MEI'],['JUNI','JUN'],['JULI','JUL'],['AGUSTUS','AGUS','AGU','AGT'],['SEPTEMBER','SEPT','SEP'],['OKTOBER','OKT','OCT'],['NOVEMBER','NOPEMBER','NOV','NOP'],['DESEMBER','DES','DEC']];
function monthFromName(name){
  const s=String(name||'').toUpperCase().replace(/[^A-Z]/g,'');
  for(let i=0;i<12;i++)if(MONTH_KEYS[i].some(k=>s===k||(k.length>=5&&s.startsWith(k))))return i+1;
  return 0;
}
function parseSalesBook(sheets,fileName){
  const num=v=>{if(v===null||v===undefined||v==='')return 0;if(typeof v==='number')return v;return parseAmount(v);};
  const yearVotes={};const vote=s=>{const m=String(s||'').match(/20\d\d/);if(m)yearVotes[m[0]]=(yearVotes[m[0]]||0)+1;};
  vote(fileName);vote(fileName);
  const months=[];
  sheets.forEach(sh=>{
    const mo=monthFromName(sh.name);if(!mo)return;
    const R=sh.rows;let h=-1;
    for(let i=0;i<Math.min(R.length,15);i++){const r=R[i]||[];if(r.some(v=>String(v||'').trim().toUpperCase()==='TANGGAL')){h=i;break;}}
    if(h<0)return;
    for(let i=0;i<h;i++)(R[i]||[]).forEach(vote);
    // judul kolom bisa satu atau dua baris
    const up=v=>String(v==null?'':v).trim().toUpperCase();
    const len=Math.max((R[h]||[]).length,(R[h-1]||[]).length);
    const H=[];for(let c=0;c<len;c++)H.push([up((R[h-1]||[])[c]),up((R[h]||[])[c])].filter(Boolean));
    const col=(...names)=>H.findIndex(parts=>parts.some(x=>names.some(n=>x.startsWith(n))));
    const C={tgl:col('TANGGAL','TGL'),omz:col('HIJAB','OMZET','OMSET','PEMASUKAN'),dis:col('DISKON'),ach:col('ACHIEVEMENT','ACHIEVMENT'),exp:col('PENGELUARAN'),emp:col('KARYAWAN','EMP'),bon:col('BONUS'),hari:col('HARI'),net:col('NET PROFIT','NET'),note:col('CATATAN','KETERANGAN','NOTE')};
    if(C.tgl<0||C.omz<0)return;
    // catatan: kolom berjudul CATATAN/KETERANGAN, atau kolom tepat setelah NET PROFIT
    const noteCol=C.note>=0?C.note:(C.net>=0?C.net+1:Math.max(C.bon,C.exp,C.emp)+2);
    // target harian: di kolom ACHIEVEMENT, pada baris judul atau baris tepat di bawahnya
    let daily=0;
    if(C.ach>=0)for(let i=Math.max(0,h-1);i<=h+2;i++){
      const r=R[i]||[];if(typeof r[C.tgl]==='number')continue;
      const v=r[C.ach],n=typeof v==='number'?v:parseAmount(v);
      if(n>=10000){daily=n;break;}
    }
    const days=[],tail=[];let lastDay=-1;
    for(let i=h+1;i<R.length;i++){
      const r=R[i];if(!r)continue;
      const t=r[C.tgl],o=num(r[C.omz]),d=C.dis>=0?num(r[C.dis]):0,x=C.exp>=0?num(r[C.exp]):0,b=C.bon>=0?num(r[C.bon]):0,em=C.emp>=0?num(r[C.emp]):0;
      const label=String((C.hari>=0?r[C.hari]:r[0])||'').toUpperCase();
      if(typeof t==='number'&&t>=1&&t<=31&&Math.floor(t)===t){
        lastDay=i;
        const nc=r[noteCol];
        const nt=typeof nc==='string'?nc.trim():'';
        if(o>0||d>0||x>0||b>0||nt)days.push({day:t,omzet:o,discount:d,expense:x,bonus:b,emp:em,note:nt});
        continue;
      }
      if(lastDay<0||label.includes('TOTAL'))continue;
      if(o>0){const note=typeof r[noteCol]==='string'&&r[noteCol].trim()?r[noteCol]:null;tail.push({amount:o,discount:d,expense:x,bonus:b,ket:note?String(note).trim():'Luar toko'});}
    }
    // buang baris yang ternyata TOTAL (jumlahnya sama dengan jumlah semua hari)
    const sumDays=days.reduce((s,x)=>s+x.omzet,0);
    let luar=tail.filter(x=>Math.abs(x.amount-sumDays)>1000);
    const sumAll=sumDays+luar.reduce((s,x)=>s+x.amount,0);
    luar=luar.filter(x=>Math.abs(x.amount-sumAll)>1000);
    if(!days.length&&!luar.length)return;
    months.push({month:mo,sheet:sh.name,daily:daily,days:days,luar:luar});
  });
  months.sort((a,b)=>a.month-b.month);
  let year=+(Object.keys(yearVotes).sort((a,b)=>yearVotes[b]-yearVotes[a])[0]||new Date().getFullYear());
  return {year:year,months:months,useTarget:true,file:fileName};
}

function runImport(){
  const p=IMP,y=p.year,pad=n=>String(n).padStart(2,'0');
  const records=[],luar=[],targets=[];
  p.months.forEach(m=>{
    const mk=y+'-'+pad(m.month),dim=new Date(y,m.month,0).getDate();
    m.days.forEach(d=>{if(d.day<=dim)records.push({date:mk+'-'+pad(d.day),omzet:d.omzet,discount:d.discount,bonus:d.bonus,expense:d.expense,emp:d.emp,note:d.note||''});});
    m.luar.forEach(l=>luar.push({month:mk,amount:l.amount,discount:l.discount,bonus:l.bonus,expense:l.expense,ket:l.ket}));
    if(p.useTarget&&m.daily)targets.push({month:mk,amount:Math.round(m.daily*dim)});
  });
  const b=$('impGo');b.disabled=true;b.textContent='Mengimpor...';
  const msg=$('impMsg');msg.className='msg';msg.textContent='Mengirim '+records.length+' hari ke database...';
  callApi('importHistoricalData',[{branch:S.branch,records:records,luar:luar,targets:targets}]).then(r=>{
    IMP=null;renderImport();
    msg.className='msg ok';
    msg.textContent='Selesai: '+r.imported+' hari masuk'+(r.skipped?', '+r.skipped+' dilewati (sudah ada)':'')+(r.luarImported?', '+r.luarImported+' data ★':'')+(r.targetsSet?', '+r.targetsSet+' target bulan':'')+(r.notesAdded?', '+r.notesAdded+' catatan dilengkapi':'')+'.';
    S.years={};refresh();
  }).catch(e=>{msg.className='msg err';msg.textContent=e.message;b.disabled=false;b.textContent='Import ke '+S.branch;});
}
