<title>J-STORE HIJAB</title>
<style>
:root{--bg:#f2f2f4;--card:#fff;--ink:#111;--ink2:#5c5c63;--ink3:#9a9aa2;--line:#e6e6ea;--soft:#f3f3f5;--bar2:#c4c4ca;--green:#1f7a3f;--greenbg:#e3f4e8;--red:#b42323;--redbg:#fde6e6;--sh:0 1px 3px rgba(0,0,0,.05);--onink:#fff;--hdrbg:rgba(242,242,244,.92);--navbg:rgba(255,255,255,.82);--line2:#d5d5da;--fold:#e1e1e7;--fold2:#ebebef;--flash:#FFEF9A;--t0:#EEF1F6;--t1:#F6F0EA;--t2:#EEF5EF;--t3:#F4EEF6;--t4:#F5F3E6;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif}
body{padding:0 14px calc(100px + env(safe-area-inset-bottom))}
.app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
.ic{width:1em;height:1em;vertical-align:-.14em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hide{display:none!important}

.title{text-align:center;padding-top:6px}
/* header terkunci */
.hdr{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 14px 10px;transition:padding .2s,box-shadow .2s}
.hin{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px;transition:gap .2s}
.hdr .title h1{transition:font-size .2s}
.hdr.stuck{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:8px;background:var(--hdrbg);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);box-shadow:0 1px 0 var(--line)}
.hdr.stuck .hin{gap:6px}
.hdr.stuck .title{padding-top:0}
.hdr.stuck .title h1{font-size:17px}
.hdr.stuck .quote{display:none}
.title h1{margin:0;font-size:26px;font-weight:700;letter-spacing:1px}
.quote{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.5;padding:0 16px;cursor:pointer;user-select:none;-webkit-user-select:none}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.br{display:flex;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:3px;gap:2px}
.br button{padding:7px 16px;border-radius:18px;font-size:14px;font-weight:600;color:var(--ink2)}
.br button.on{background:var(--ink);color:var(--onink)}
.pillbtn{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:500;overflow:hidden}
.pillbtn input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;-webkit-appearance:none;appearance:none}

.card{background:var(--card);border-radius:14px;padding:14px}
.card.bd{border:1px solid var(--line)}
.card.np{padding:0;overflow:hidden}
.lbl{font-size:12px;color:var(--ink2)}
.sub{font-size:11px;color:var(--ink3)}
.val{font-size:17px;font-weight:700;margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec{font-size:14px;font-weight:700;margin:4px 2px 0}
.prog{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:10px 0 8px}
.prog>div{height:100%;background:var(--ink);border-radius:6px;transition:width .3s}
.rbtn{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card)}
.rbtn.dark{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.rbtn .ic{transition:transform .2s}
.rbtn.open .ic{transform:rotate(180deg)}

@keyframes rnLegA{0%,100%{transform:rotate(30deg)}50%{transform:rotate(-30deg)}}
@keyframes rnLegB{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}}
@keyframes rnArm{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(22deg)}}
@keyframes rnWind{0%{opacity:0;transform:translateX(6px)}40%{opacity:1}100%{opacity:0;transform:translateX(-10px)}}
@keyframes rnCheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes rnSpark{0%,100%{opacity:.2}50%{opacity:1}}
.rn-bob{animation:rnBob .42s ease-in-out infinite}
.rn-la{transform-origin:0 0;animation:rnLegA .42s ease-in-out infinite}
.rn-lb{transform-origin:0 0;animation:rnLegB .42s ease-in-out infinite}
.rn-arm{transform-origin:0 0;animation:rnArm .42s ease-in-out infinite}
.rn-wd{animation:rnWind .8s linear infinite}
.rn-ch{animation:rnCheer .6s ease-in-out infinite}
.rn-sp{animation:rnSpark 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.rn-bob,.rn-la,.rn-lb,.rn-arm,.rn-wd,.rn-ch,.rn-sp{animation:none}}
.achrow{display:flex;align-items:center;gap:16px;margin:4px 0 2px}
.achbar{flex:1;min-width:0}
.achinfo{flex:1;min-width:0;font-size:12px;color:var(--ink2);line-height:1.6;border-left:1px solid var(--line);padding-left:14px}
.achinfo b{color:var(--ink)}
.vc{display:flex;align-items:center;gap:12px}
.vcl{flex:1;min-width:0}
.vcr{flex:0 0 auto;min-width:118px;border-left:1px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:4px}
.vcr .cmp{gap:10px}
@media (max-width:600px){
  .achrow{flex-direction:column;align-items:stretch;gap:8px}.achinfo{border-left:0;border-top:1px solid var(--line);padding:8px 0 0;font-size:12px}
  .vc{flex-direction:column;align-items:stretch;gap:6px}
  .vcr{border-left:0;border-top:1px solid var(--line);padding:6px 0 0;min-width:0}
}
/* tabel belanja: scroll sendiri, judul kolom tetap */
.btwrap{max-height:calc(100dvh - var(--hdrH,120px) - 190px);min-height:320px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:10px}
.bch,.bwk{display:flex;align-items:flex-end;gap:4px;margin-top:18px;border-bottom:1px solid var(--line)}
.bwk{gap:16px;padding:0 6px}
.bwg{flex:1;display:flex;align-items:flex-end;gap:4px;height:100%}
.bcol{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;padding:0}
.bcol b{display:block;width:100%;max-width:46px;background:var(--line2);border-radius:5px 5px 0 0}
.bcol.on b{background:var(--ink)}
.bcol.dim b{background:var(--line2)}
.bcol span{font-size:10px;color:var(--ink2);white-space:nowrap;margin-bottom:3px}
.bcol.on span{color:var(--ink);font-weight:700}
.bmlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
@media (min-width:700px){.bmlist{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bmlist button{display:flex;justify-content:space-between;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2);text-align:left}
.bmlist button b{color:var(--ink);font-weight:700}
.bmlist button.on{color:var(--ink);font-weight:700}
.bml{display:flex;gap:4px;margin-top:5px}
.bml div{flex:1;text-align:center;font-size:11px;color:var(--ink3);line-height:1.3}
.bml div.on{color:var(--ink);font-weight:700}
.blg{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:10px}
.blg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bwt{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.bwt th{font-size:11px;color:var(--ink3);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.bwt td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.bwt th:first-child,.bwt td:first-child{text-align:left}
.bwt tr.t td{font-weight:800;border-bottom:0}
@media (max-width:600px){.bcol span{font-size:9px}.bwt{font-size:12px}}
.btab tbody.slL{animation:slL .22s ease}.btab tbody.slR{animation:slR .22s ease}

/* kotak analisa AI */
.aibox{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.aibox textarea{width:100%;height:58px;margin-top:8px;border:0;border-radius:10px;background:var(--soft);padding:7px 9px;font:11px/1.45 ui-monospace,Menlo,monospace;color:var(--ink2);resize:none}
.aibox input{width:100%;margin-top:6px;border:0;border-radius:10px;background:var(--soft);padding:8px 9px;font:inherit;font-size:13px}
.aicp{display:inline-flex;align-items:center;gap:5px;background:var(--ink);color:var(--onink);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:700}
.aicp .ic{width:14px;height:14px}

/* saran kata */
.sugdd{position:absolute;left:0;top:calc(100% + 4px);z-index:80;width:max(100%,240px);max-width:calc(100vw - 20px);background:var(--card);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.16);overflow:hidden;text-align:left}
.sgr{position:relative;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.sgr:last-child{border-bottom:0}
.sgr.on{background:var(--soft)}
.sgr.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--ink)}
.sgi{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--ink);padding:10px 12px;outline:none;caret-color:transparent;cursor:pointer}
.sgr small{font-size:11px;color:var(--ink3);padding-right:12px}

/* status & kunci */
.status{background:var(--redbg);color:var(--red);border-radius:12px;padding:11px 13px;font-size:13px}
.status.info{background:var(--card);color:var(--ink2);box-shadow:var(--sh)}
.link{display:block;margin:6px auto 0;font-size:12px;color:var(--ink2);text-decoration:underline}

/* menu bawah */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(480px,calc(100% - 28px));background:var(--navbg);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border:1px solid rgba(0,0,0,.06);border-radius:30px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 4px;box-shadow:0 10px 30px rgba(0,0,0,.10);z-index:50}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink3);font-weight:500}
.nav button .ic{font-size:23px}
.nav button.on{color:var(--ink);font-weight:700}

/* pop-up bulan (liquid glass hitam-putih) */
.ov{position:fixed;inset:0;z-index:100;background:rgba(12,12,14,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;padding:18px}
.ov.show{display:flex}
.glass{background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%);border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08),0 12px 34px rgba(0,0,0,.45)}
.pk{width:100%;max-width:320px;border-radius:30px;padding:18px 14px 20px;color:#fff}
.pk .yr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.pk .yr b{font-size:19px;letter-spacing:1px}
.pk .nb{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.mg{display:grid;grid-template-columns:repeat(4,58px);gap:8px;justify-content:center}
.mc{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;transition:transform .15s}
.mc:active{transform:scale(.92)}
.mc.on{background:#fff;color:#111;box-shadow:inset 0 1px 0 #fff,0 6px 20px rgba(255,255,255,.3)}
.pk .acts{display:flex;gap:10px;margin-top:18px}
.pk .acts button{flex:1;padding:12px 0;border-radius:22px;font-size:13px;font-weight:600;color:#fff}
.pk .acts .w{background:#fff;color:#111}

/* ===== v7: tab map (folder) ===== */
.ftabs{display:flex;gap:6px;padding:0 8px;position:relative;z-index:1}
.ftabs button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 8px 10px;border-radius:16px 16px 0 0;background:var(--fold2);color:var(--ink3);font-size:14px;font-weight:600;transform:translateY(5px);transition:background .25s,color .25s,transform .25s}
.ftabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftabs button.on{background:var(--fold);color:var(--ink);font-weight:800;transform:none}
.ftabs button .ic{font-size:17px}
.fpanel{background:var(--fold);border-radius:18px;padding:10px}
.fpanel .btwrap{max-height:calc(100dvh - var(--hdrH,120px) - 250px)}
.fpanel .rwrap,.fpanel .pwrap{min-height:0}
.pillbtn.dk{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.btab .c{text-align:center}
.btab thead tr:first-child th[colspan]{height:28px;padding:8px 6px 2px;text-align:center}
.btab tr.h2 th{top:28px;height:24px;border-radius:0!important;font-size:11px;padding:2px 6px 6px;color:color-mix(in srgb,var(--onink) 78%,var(--ink))}

/* ===== v7: rencana belanja ===== */
.rhl{font-size:13px;color:var(--ink2);margin-bottom:6px}
.rdt{font-size:15px;padding:9px 14px}
.rdt b{font-weight:700}
.rstrip{position:relative;display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding:2px 1px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rstrip::-webkit-scrollbar{display:none}
.rsd{flex:0 0 auto;width:56px;padding:7px 0 6px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .2s,color .2s,transform .15s}
.rsd:active{transform:scale(.94)}
.rsd small{font-size:10px;color:var(--ink3);white-space:nowrap}
.rsd b{font-size:17px;line-height:1.2}
.rsd i{width:5px;height:5px;border-radius:50%}
.rsd i.dot{background:var(--ink)}
.rsd.tdy{box-shadow:inset 0 0 0 1.5px var(--line)}
.rsd.on{background:var(--ink);color:var(--onink);box-shadow:none}
.rsd.on small{color:#c9c9cf}.rsd.on i.dot{background:var(--card)}
.rtab .r1{width:36%}.rtab .r2{width:11%}.rtab .r3{width:23%}.rtab .r4{width:19%}
.rq{text-align:center;font-weight:600}
.ru{font-size:10px;color:var(--ink3);text-align:right;padding-right:4px;margin-top:-3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btab td.rt{font-weight:700;text-align:right;padding-right:10px;white-space:nowrap}
.btab tfoot td{position:sticky;bottom:0;z-index:4;background:var(--ink);color:var(--onink);font-weight:800;padding:10px 6px;font-size:13px;white-space:nowrap}
.btab tfoot td:first-child{border-radius:0 0 0 10px;padding-left:10px}.btab tfoot td:last-child{border-radius:0 0 10px 0;padding-right:10px}
.btab tfoot .sub{color:var(--onink);opacity:.6;font-weight:500}
.btab tfoot td.r{text-align:right}
@media (max-width:600px){
  .rtab .r1{width:29%}.rtab .r2{width:11%}.rtab .r3{width:23%}.rtab .r4{width:26%}
  .rtab .bnum span{display:none}
  .btab tr.h2 th{font-size:10px;padding:2px 1px 6px}
  .rtab td.rt{padding-right:6px;font-size:12px}
  .btab tfoot td{font-size:12px;padding:9px 4px}.btab tfoot td:first-child{padding-left:8px}.btab tfoot td:last-child{padding-right:6px}
  .btab tfoot .sub{display:none}
  .ptab{min-width:930px}.ptab .p1{width:120px}
  .ftabs button{font-size:13px;gap:5px}
}

/* ===== v7: data produk ===== */
.psearch{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--soft);border-radius:12px;padding:0 12px;color:var(--ink3)}
.psearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px 0;font-size:15px;color:var(--ink)}
.ptab{min-width:1010px}
.ptab .p1{width:150px}
.ptab td.p1,.ptab th.p1h{position:sticky;left:0;z-index:3;background:var(--card);box-shadow:1px 0 0 var(--line)}
.ptab th.p1h{z-index:7;background:var(--ink);box-shadow:none}
.ptab td.pf{text-align:right;padding-right:10px;line-height:1.2}
.ptab td.pf b{display:block;font-size:13px;color:var(--green)}
.ptab td.pf small{font-size:11px;color:var(--green);opacity:.8}
.ptab td.pf.neg b,.ptab td.pf.neg small{color:var(--red)}
.ptab .pm{width:74px}
.ptab td.pmg{text-align:right;padding-right:10px;font-size:13px}
.ptab td.pmg b{font-weight:700}
.ptab td.pmg.neg b{color:var(--red)}
#calcTip{position:fixed;z-index:120;pointer-events:none;background:var(--ink);color:var(--onink);font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;white-space:nowrap}
#calcTip.show{opacity:1;transform:none}
.ptab tbody tr[data-id] td{background:var(--card)}
.pfg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.pfb{background:var(--soft);border-radius:12px;padding:10px 12px;min-width:0}
.pfb small{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink2)}
.pfb b{display:block;font-size:22px;font-weight:800;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfb.tx b{font-size:15px;margin:4px 0 3px}
.pfb span{display:block;font-size:12px;color:var(--ink2)}
@media (max-width:700px){.pfg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sgr small.sp{background:var(--ink);color:var(--onink);border-radius:99px;padding:2px 7px;margin-right:10px;font-size:10px;font-weight:600}

/* ===== v7: animasi ===== */
@keyframes pgInL{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes pgInR{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
main.pgL,.fxL{animation:pgInL .32s cubic-bezier(.2,.8,.2,1)}
main.pgR,.fxR{animation:pgInR .32s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
main.fx>div:not(.fpanel)>*,main.fx>.fpanel:not(.hide)>div>*{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
main.fx>div>*:nth-child(2){animation-delay:.05s}main.fx>div>*:nth-child(3){animation-delay:.1s}main.fx>div>*:nth-child(4){animation-delay:.15s}
main.fx>div>*:nth-child(5){animation-delay:.2s}main.fx>div>*:nth-child(6){animation-delay:.25s}main.fx>div>*:nth-child(7){animation-delay:.3s}main.fx>div>*:nth-child(n+8){animation-delay:.35s}
main.fx>.fpanel>div>*:nth-child(2){animation-delay:.06s}main.fx>.fpanel>div>*:nth-child(3){animation-delay:.12s}main.fx>.fpanel>div>*:nth-child(n+4){animation-delay:.18s}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
main.fx .dcol .b,main.fx .bcol b{transform-origin:bottom;animation:grow .7s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes navB{0%{transform:scale(.75)}50%{transform:scale(1.25) translateY(-3px)}100%{transform:none}}
.nav button{transition:color .2s}
.nav button.bounce .ic{animation:navB .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.14)}100%{transform:none}}
.pop{animation:pop .34s cubic-bezier(.3,1.5,.5,1)}
@keyframes pulse{50%{opacity:.4}}
.syncb.busy{animation:pulse 1.1s ease-in-out infinite}
.syncb.ok{background:var(--greenbg)!important;color:var(--green)!important;animation:pop .35s}
.btn{transition:background .25s}
.btn.okb{background:var(--green)}
@keyframes flash{0%,35%{background:var(--flash)}}
tr.flash td{animation:flash 1.9s ease-out}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#dbPanel>.panel{animation:slideDown .3s cubic-bezier(.2,.8,.2,1)}
.sugdd:not(.hide){animation:slideDown .18s ease-out}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== tema gelap ===== */
html.dark{--bg:#000;--card:#1c1c1e;--ink:#f2f2f4;--ink2:#a5a5ad;--ink3:#6f6f77;--line:#2c2c30;--soft:#2a2a2e;--bar2:#4a4a50;--green:#34c46a;--greenbg:#12301d;--red:#ff6b6b;--redbg:#3a1717;
  --onink:#111;--hdrbg:rgba(0,0,0,.86);--navbg:rgba(30,30,32,.84);--line2:#3a3a40;--fold:#161618;--fold2:#0e0e10;--flash:#5a4a10;--t0:#1a1f2a;--t1:#2a2219;--t2:#18261c;--t3:#251c29;--t4:#26241a;color-scheme:dark}
html.dark .btab th,html.dark .btab tfoot td{background:#3a3a3f;color:var(--ink)}
html.dark .btab tr.h2 th{color:var(--ink2)}
html.dark .btab tfoot .sub{color:var(--ink2);opacity:1}
html.dark .ptab th.p1h{background:#3a3a3f}
html.dark .runsvg{filter:invert(1) hue-rotate(180deg)}
html.dark .nav{border-color:rgba(255,255,255,.08)}
html.dark .sugdd{box-shadow:0 8px 24px rgba(0,0,0,.6);border:1px solid var(--line)}
html.dark .bc:focus{box-shadow:inset 0 0 0 2px var(--ink)}
html.dark .card.bd,html.dark .belbox,html.dark .aibox{box-shadow:none}
html.dark input[type=date]{color-scheme:dark}
.thm{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);color:var(--ink);transition:transform .3s}
.thm .ic{font-size:16px}
.thm:active{transform:rotate(-30deg) scale(.9)}
html.thx,html.thx *{transition:background-color .35s,color .35s,border-color .35s!important}
</style>

<body>
<header class="hdr" id="hdr"><div class="hin">
  <div class="title">
    <h1>J-STORE HIJAB<span id="syncB" class="syncb hide"></span></h1>
    <div class="quote hide" id="quote" onclick="nextQuote()"></div>
  </div>
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:8px">
      <div class="br">
        <button id="bF" onclick="setBranch('Blok F')">F</button>
        <button id="bB" onclick="setBranch('Blok B')">B</button>
      </div>
      <button class="thm" id="thmBtn" onclick="toggleTheme()" aria-label="Ganti tema terang / gelap"></button>

</div></header>

<div class="app">
  <div id="hdrSp"></div>

  <div class="status hide" id="statusBar"></div>

  <section class="card bd hide" id="keyBox">
    <div style="font-size:15px;font-weight:700;margin-bottom:8px">Kunci akses</div>
    <label class="fld soft"><small>Masukkan kunci akses aplikasi</small>
      <input type="password" id="keyInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>

</nav>

<div class="ov" id="ov" onclick="if(event.target===this)closePicker()">
  <div class="pk glass">
    <div class="yr">
      <button class="nb glass" onclick="pkYear(-1)" aria-label="Tahun sebelumnya" id="pkL"></button>
      <b id="pkY"></b>
      <button class="nb glass" onclick="pkYear(1)" aria-label="Tahun berikutnya" id="pkR"></button>
    </div>
    <div class="mg" id="pkG"></div>

  </div>
</div>

<input type="file" id="csvFile" accept=".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,text/plain" class="hide" onchange="importFile(this)">

<script>
// =====================================================

const API_URL = 'https://script.google.com/macros/s/AKfycbzwK1ZtcSIS3JUX3_5uyziyziHWqdFtNQfk1Xy0F5ECrzGd-BSVCERH3ycOTpCVrwiD/exec';

(function readKeyFromUrl(){
  try{
    const k=(new URLSearchParams(location.search).get('k')||'').trim();
    if(k){localStorage.setItem('jstore_api_key',k);sessionStorage.setItem('jstore_api_key',k);}
  }catch(e){}
})();

function getApiKey(){
  try{
    return (new URLSearchParams(location.search).get('k')||'').trim()||
      localStorage.getItem('jstore_api_key')||sessionStorage.getItem('jstore_api_key')||'';
  }catch(e){return '';}
}
function showKeyBox(m){$('keyBox').classList.remove('hide');$('keyMessage').textContent=m||'';}
function saveApiKey(){
  const k=$('keyInput').value.trim();
  if(!k){showKeyBox('Kunci belum diisi.');return;}
  try{localStorage.setItem('jstore_api_key',k);}catch(e){}
  $('keyInput').value='';$('keyBox').classList.add('hide');showStatus('');refresh();
}
function resetApiKey(){try{localStorage.removeItem('jstore_api_key');sessionStorage.removeItem('jstore_api_key');}catch(e){}showKeyBox('');window.scrollTo({top:0,behavior:'smooth'});}
function showStatus(t,info){const el=$('statusBar');el.textContent=t;el.classList.toggle('hide',!t);el.classList.toggle('info',!!info);}

function callApi(action,args){
  const key=getApiKey();
  if(!key){showKeyBox('');return Promise.reject(new Error('Masukkan kunci akses dulu.'));}
  const ac=window.AbortController?new AbortController():null;
  const to=ac?setTimeout(()=>ac.abort(),40000):0;
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:action,args:args||[],key:key}),signal:ac?ac.signal:undefined})
    .catch(e=>{const er=new Error(e&&e.name==='AbortError'?'Server terlalu lama merespons. Muat ulang halaman.':'Tidak bisa terhubung ke server. Cek internet.');er.network=true;throw er;})
    .finally(()=>clearTimeout(to))
    .then(r=>r.text())
    .then(t=>{
      let r;try{r=JSON.parse(t);}catch(e){throw new Error('Server tidak membalas JSON. Pastikan Code.gs terbaru sudah di-Deploy (New version).');}
      if(!r.ok){
        if(r.error==='Kunci akses salah.'){try{localStorage.removeItem('jstore_api_key');}catch(e){}showKeyBox('Kunci akses salah. Coba lagi.');}
        throw new Error(r.error||'Terjadi kesalahan server.');
      }
      return r.data;
    });
}

// Cache: tampilkan data terakhir dulu (instan), lalu perbarui dari server
const MEM={};
function ck(a,args){return 'jst2:'+a+':'+JSON.stringify(args);}
function getCached(a,args){const k=ck(a,args);if(MEM[k])return MEM[k];try{const v=JSON.parse(localStorage.getItem(k)||'null');if(v)MEM[k]=v;return v;}catch(e){return null;}}
function setCached(a,args,v){const k=ck(a,args);MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function load(a,args,cb){
  const c=getCached(a,args);
  if(c){try{cb(withPending(a,clone(c)),true);}catch(e){showStatus('⚠️ Error tampilan: '+e.message);}}
  else if(getApiKey())showStatus(navigator.onLine===false?'Offline · data ini belum pernah dibuka di perangkat ini.':'⏳ Memuat data dari server...',true);
  return callApi(a,args).then(d=>{setNet(true);setCached(a,args,d);showStatus('');cb(withPending(a,clone(d)),false);return d;})
    .catch(e=>{
      if(e.network){setNet(false);if(c)showStatus('');return;}
      if(/Aksi tidak dikenal/.test(e.message))showStatus('⚠️ Apps Script di server masih versi lama (belum ada fitur '+a+'). Deploy Code_v8: Manage deployments → Edit → Version: New version → Deploy.');
      else if(e.message!=='Masukkan kunci akses dulu.')showStatus('⚠️ '+e.message);
    });
}

// MODE OFFLINE + SINKRON OTOMATIS
// Setiap simpan masuk antrean (outbox) di perangkat dulu, langsung tampil,
// lalu dikirim ke Apps Script. Gagal/offline → dicoba lagi tiap 15 detik
// dan saat koneksi kembali. Baris baru diberi ID dari perangkat.
// =====================================================
const OB_KEY='jst2:outbox';
let OB=(()=>{try{return JSON.parse(localStorage.getItem(OB_KEY)||'[]')||[];}catch(e){return [];}})();
let OB_BUSY=false,NET_OK=true;
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
function uid(){return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function saveOB(){try{localStorage.setItem(OB_KEY,JSON.stringify(OB));}catch(e){}}
function setNet(ok){NET_OK=ok;syncBadge();}
function syncBadge(){
  const el=$('syncB');if(!el)return;
  const n=OB.length,off=navigator.onLine===false||!NET_OK;
  let t='';
  if(off)t='• offline'+(n?' · '+n+' belum terkirim':'');
  else if(n)t='• menyimpan…';
  if(!t&&S.obWas&&!off){t='✓ tersimpan';clearTimeout(S.okT);S.okT=setTimeout(()=>{S.obWas=0;syncBadge();},1600);}
  else if(n)S.obWas=1;
  el.textContent=t;el.classList.toggle('hide',!t);el.classList.toggle('off',off);
  el.classList.toggle('busy',!off&&n>0);el.classList.toggle('ok',t==='✓ tersimpan');
}
// tambah ke antrean: langsung tampil di layar, lalu dikirim
function enqueue(ops){
  (Array.isArray(ops[0])?ops:[ops]).forEach(o=>OB.push({id:uid(),action:o[0],args:o[1],t:Date.now()}));
  saveOB();syncBadge();applyLocal();flush();
}
let OB_RETRY=0;
function flush(){
  if(OB_BUSY||!OB.length||!getApiKey())return;
  OB_BUSY=true;syncBadge();
  const ops=OB.slice(0,40);
  callApi('batch',[ops]).then(res=>{
    setNet(true);
    const sent={};let bad=[],old=0;
    // "Aksi tidak dikenal" = Apps Script belum diperbarui: data TIDAK dibuang, tetap di antrean
    (res||[]).forEach(r=>{if(!r.ok&&/Aksi tidak dikenal/.test(r.error||'')){old++;return;}sent[r.id]=1;if(!r.ok)bad.push(r.error);});
    OB=OB.filter(o=>!sent[o.id]);saveOB();
    OB_BUSY=false;syncBadge();
    if(old){showStatus('⚠️ Apps Script di server masih versi lama. '+old+' data disimpan dulu di perangkat ini dan akan terkirim otomatis setelah Code_v8 di-deploy (Manage deployments → New version).');clearTimeout(OB_RETRY);OB_RETRY=setTimeout(flush,30000);return;}
    if(bad.length)showStatus('⚠️ Sebagian data ditolak server: '+bad[0]);
    if(OB.length)flush();else refresh();   // semua terkirim → ambil data terbaru
  }).catch(e=>{
    OB_BUSY=false;
    if(e.network)setNet(false);else showStatus('⚠️ '+e.message);
    clearTimeout(OB_RETRY);OB_RETRY=setTimeout(flush,15000);
  });
}
setInterval(()=>{if(OB.length)flush();},15000);
window.addEventListener('online',()=>{setNet(true);flush();refresh();});
window.addEventListener('offline',()=>syncBadge());

// ---- tampilkan data yang belum terkirim di atas data server ----
const DKEYS=['discount','expense','bonus'],FK={discount:'discountF',expense:'expenseF',bonus:'bonusF'};
function withPending(a,d){
  if(!d)return d;
  if(a==='getMonth')return applyMonthOps(d);
  if(a==='getDashboard'){['cur','prev','ly'].forEach(k=>{if(d[k])applyMonthOps(d[k]);});return d;}
  if(a==='getBelanja')return applyBelOps(d);
  if(a==='getRencana')return applyRenOps(d);
  if(a==='getProduk')return applyProdOps(d);
  return d;
}
function normDay(x){
  ['omzet','discount','expense','bonus','emp'].forEach(k=>{x[k]=Number(x[k]||0);});
  x.incomes=x.incomes||[];x.note=x.note||'';
  return x;
}
function applyMonthOps(m){
  if(!m||!m.days)return m;
  const inMonth=d=>d&&d.slice(0,7)===m.month;
  const dayOf=d=>m.days[+d.slice(8,10)-1];
  const findInc=id=>{for(const x of m.days){const i=(x.incomes||[]).findIndex(t=>t.id===id);if(i>=0)return [x,i];}return null;};
  let touched=false;
  OB.forEach(o=>{
    const a=o.args&&o.args[0];
    switch(o.action){
      case 'addIncome':if(a.branch===m.branch&&inMonth(a.date)){const x=normDay(dayOf(a.date));if(!x.incomes.some(t=>t.id===a.id))x.incomes.push({id:a.id,amount:a.amount,f:a.f||''});touched=true;}break;
      case 'updateIncome':{const r=findInc(o.args[0]);if(r){const amt=Number(o.args[1]||0);if(amt)Object.assign(r[0].incomes[r[1]],{amount:amt,f:o.args[2]||''});else r[0].incomes.splice(r[1],1);touched=true;}}break;
      case 'deleteIncome':{const r=findInc(o.args[0]);if(r){r[0].incomes.splice(r[1],1);touched=true;}}break;
      case 'setDayField':if(a.branch===m.branch&&inMonth(a.date)){const x=normDay(dayOf(a.date));if(a.field==='note')x.note=a.value||'';else{x[a.field]=Number(a.value||0);if(FK[a.field])x[FK[a.field]]=a.f||'';}touched=true;}break;
      case 'deleteDay':if(o.args[0]===m.branch&&inMonth(o.args[1])){const x=dayOf(o.args[1]);Object.assign(x,{incomes:[],omzet:0,discount:0,expense:0,bonus:0,emp:0,note:'',discountF:'',expenseF:'',bonusF:''});touched=true;}break;
      case 'addLuar':if(a.branch===m.branch&&a.month===m.month&&!m.luar.entries.some(e=>e.id===a.id)){m.luar.entries.push({id:a.id,ket:a.ket||'',amount:a.amount,discount:a.discount||0,bonus:a.bonus||0,expense:a.expense||0});touched=true;}break;
      case 'updateLuar':{const i=m.luar.entries.findIndex(e=>e.id===a.id);if(i>=0){if(!a.amount)m.luar.entries.splice(i,1);else Object.assign(m.luar.entries[i],{ket:a.ket||'',amount:a.amount,discount:a.discount||0,bonus:a.bonus||0,expense:a.expense||0});touched=true;}}break;
      case 'deleteLuar':{const i=m.luar.entries.findIndex(e=>e.id===o.args[0]);if(i>=0){m.luar.entries.splice(i,1);touched=true;}}break;
      case 'setTarget':if(o.args[0]===m.branch&&o.args[1]===m.month){const v=Number(o.args[2]||0);m.target.custom=!!v;m.target.monthly=v||m.target.monthly;m.target.daily=m.target.monthly/m.daysInMonth;touched=true;}break;
    }
  });
  if(touched)recalcMonth(m);
  return m;
}
// hitung ulang satu bulan (sama seperti di Code.gs)
function recalcMonth(m){
  const daily=m.target.daily,MG=0.35;
  const t={omzet:0,profit:0,modal:0,discount:0,expense:0,bonus:0,net:0,empSum:0,achSum:0,filled:0};
  m.days.forEach(x=>{
    normDay(x);
    x.omzet=x.incomes.reduce((s,i)=>s+Number(i.amount||0),0);
    x.has=x.omzet>0||x.discount>0||x.expense>0||x.bonus>0;
    x.profit=x.omzet*MG;x.modal=x.omzet-x.profit;x.net=x.profit-x.discount-x.expense-x.bonus;
    x.achievement=daily?x.omzet/daily*100:0;
    if(!x.has)return;
    t.omzet+=x.omzet;t.profit+=x.profit;t.modal+=x.modal;t.discount+=x.discount;t.expense+=x.expense;t.bonus+=x.bonus;t.net+=x.net;t.empSum+=x.emp;t.achSum+=x.achievement;t.filled++;
  });
  m.toko={omzet:t.omzet,profit:t.profit,modal:t.modal,discount:t.discount,expense:t.expense,bonus:t.bonus,net:t.net,filled:t.filled,achievement:t.filled?t.achSum/t.filled:0,empAvg:t.filled?t.empSum/t.filled:0};
  const L=m.luar;L.count=L.entries.length;L.omzet=0;L.discount=0;L.bonus=0;L.expense=0;
  L.entries.forEach(e=>{L.omzet+=e.amount;L.discount+=e.discount;L.bonus+=e.bonus;L.expense+=e.expense;});
  L.profit=L.omzet*MG;L.modal=L.omzet-L.profit;L.net=L.profit-L.discount-L.bonus-L.expense;
}
function applyBelOps(b){
  if(!b||!b.items)return b;
  OB.forEach(o=>{
    const a=o.args&&o.args[0];
    if(o.action==='upsertBelanja'){
      const it=b.items.find(i=>i.id===a.id);
      const pick={};['date','name','amount','f','bon','done'].forEach(k=>{if(a[k]!==undefined)pick[k]=a[k];});
      if(it)Object.assign(it,pick);
      else if(a.branch===b.branch&&String(a.date||'').slice(0,4)===String(b.year))b.items.push(Object.assign({id:a.id,date:a.date,name:'',amount:0,f:'',bon:false,done:false},pick));
    }else if(o.action==='deleteBelanja'){b.items=b.items.filter(i=>i.id!==o.args[0]);}
  });
  return b;
}
function applyRenOps(r){
  if(!r||!r.items)return r;
  OB.forEach(o=>{
    const a=o.args&&o.args[0];
    if(o.action==='upsertRencana'){
      const it=r.items.find(i=>i.id===a.id),pick={};
      ['date','name','k','s','hk','hs'].forEach(k=>{if(a[k]!==undefined)pick[k]=a[k];});
      if(it)Object.assign(it,pick);else if(a.branch===r.branch)r.items.push(Object.assign({id:a.id,date:a.date,name:'',k:0,s:0,hk:0,hs:0},pick));
    }else if(o.action==='deleteRencana')r.items=r.items.filter(i=>i.id!==o.args[0]);
  });
  return r;
}
function applyProdOps(p){
  if(!p||!p.items)return p;
  OB.forEach(o=>{
    const a=o.args&&o.args[0];
    if(o.action==='upsertProduk'){
      const it=p.items.find(i=>i.id===a.id),pick={};
      ['name','bs','bk','js','jk'].forEach(k=>{if(a[k]!==undefined)pick[k]=a[k];});
      if(it)Object.assign(it,pick);else p.items.push(Object.assign({id:a.id,name:'',bs:0,bk:0,js:0,jk:0},pick));
    }else if(o.action==='deleteProduk')p.items=p.items.filter(i=>i.id!==o.args[0]);
  });
  return p;
}
// setelah simpan: data di layar langsung diperbarui tanpa menunggu server
function applyLocal(){
  Object.keys(S.months).forEach(k=>applyMonthOps(S.months[k]));
  if(S.dbMonth)applyMonthOps(S.dbMonth);
  if(S.dash)withPending('getDashboard',S.dash);
  Object.keys(S.bel).forEach(k=>applyBelOps(S.bel[k]));
  Object.keys(S.ren).forEach(k=>applyRenOps(S.ren[k]));
  if(S.prod)applyProdOps(S.prod);
  if(S.page==='input')updateInputData();
  else if(S.page==='dash'&&S.dash)renderDash(S.dash);
  else if(S.page==='db'){if(S.dbTab==='produk')renderProdSafe();else if(S.dbMonth)renderDbTable();}
  else if(S.page==='bel'){if(S.belTab==='renc')renderRenSafe();else renderBelSafe();}
}

// Angka bisa berupa hitungan: "1.000.000 + 200.000 - 50.000" -> 1.150.000
// operator: + −  ×(x * ×)  ÷(/ : ÷) · perkalian & pembagian dihitung dulu
const OPRE=/[+\-×÷xX*\/:]/;
const normOp=v=>String(v==null?'':v).replace(/[xX*]/g,'×').replace(/[\/:]/g,'÷');
const hasOp=v=>/\d\s*[+\-×÷]\s*\d?/.test(normOp(v).replace(/^\s*-/,''));
function evalExpr(v){
  const t=normOp(v).replace(/\./g,'').replace(/[^\d,+\-×÷]/g,'').match(/\d+(?:,\d+)?|[+\-×÷]/g)||[];
  const nums=[],ops=[];let want=true;
  t.forEach(x=>{if(/\d/.test(x)){if(want){nums.push(Number(x.replace(',','.')));want=false;}}else if(!want){ops.push(x);want=true;}});
  if(want&&ops.length)ops.pop();
  // × ÷ dulu
  const n2=[nums[0]||0],o2=[];
  ops.forEach((o,i)=>{const b=nums[i+1];if(o==='×')n2[n2.length-1]*=b;else if(o==='÷'){if(b)n2[n2.length-1]/=b;}else{o2.push(o);n2.push(b);}});
  let r=n2[0];o2.forEach((o,i)=>{r=o==='+'?r+n2[i+1]:r-n2[i+1];});
  return Math.max(0,Math.round(r));
}
const parseAmount=v=>{
  if(hasOp(v))return evalExpr(v);
  const s=String(v==null?'':v).replace(/[^\d+\-]/g,'');
  if(!/\d[+\-]/.test(s)){const d=s.replace(/\D/g,'');return d?Number(d):0;}
  let t=0;(s.match(/[+\-]?\d+/g)||[]).forEach(x=>t+=Number(x));return Math.max(0,t);
};

// Kolom angka: nol hilang saat diketik, format ribuan otomatis
// Rumus disimpan di data-f: saat kolom diketuk lagi, rumusnya muncul untuk dikoreksi
function bindNum(el,onChange,noMini){
  el.addEventListener('focus',()=>{
    if(el.dataset.f)el.value=el.dataset.f;
    else if(parseAmount(el.value)===0)el.value='';
  });
  el.addEventListener('input',e=>{
    let v=el.value;
    // hapus (backspace) setelah spasi tanda +/- : tandanya ikut terhapus
    if(e&&/^delete/.test(e.inputType||'')&&/[+\-×÷]$/.test(v.trim()===v?v:''))v=v.replace(/\s*[+\-×÷]$/,'');
    el.value=OPRE.test(v.replace(/^\s*-/,''))?fmtExpr(v):fmtIn(parseAmount(v));
    calcTip(el);
    if(onChange)onChange();
  });
  // saat pindah kolom / Enter: hitungan langsung dijumlahkan
  el.addEventListener('blur',()=>{
    calcTip(null);
    el.dataset.f=hasOp(el.value)?fmtExpr(el.value).trim().replace(/\s*[+\-×÷]\s*$/,''):'';
    el.value=fmtIn(parseAmount(el.value))||'0';if(onChange)onChange();
  });
  const box=noMini?null:el.closest('.fld,.trx');
  if(box&&!box.querySelector('.mini')){
    const b=document.createElement('button');b.type='button';b.className='mini';b.textContent='+';b.setAttribute('aria-label','Tambah');
    b.addEventListener('pointerdown',e=>e.preventDefault());
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.addEventListener('click',e=>{e.preventDefault();addOpEl(el,'+');});
    box.appendChild(b);
  }
}
// hasil hitungan tampil kecil di atas kolom saat mengetik rumus
function calcTip(el){
  let t=$('calcTip');
  if(!el||!hasOp(el.value)||!/\d\s*$/.test(el.value)){if(t)t.classList.remove('show');return;}
  if(!t){t=document.createElement('div');t.id='calcTip';document.body.appendChild(t);}
  t.textContent='= '+rp(parseAmount(el.value));t.classList.add('show');
  const r=el.getBoundingClientRect(),w=t.offsetWidth,h=t.offsetHeight;
  t.style.left=Math.max(6,Math.min(innerWidth-w-6,r.right-w))+'px';
  t.style.top=(r.top>h+70?r.top-h-6:r.bottom+6)+'px';
}
window.addEventListener('scroll',()=>calcTip(null),{passive:true});
function fOf(el){if(!el)return '';return hasOp(el.value)?fmtExpr(el.value).trim():(el.dataset.f||'');}
function setNum(el,val,f){if(!el)return;el.value=f||fmtIn(val)||'0';el.dataset.f=f||'';}
function addOp(id,op){addOpEl($(id),op);}
function addOpEl(el,op){
  if(!el)return;
  if(document.activeElement!==el)el.focus();
  let v=el.value.replace(/\s*[+\-×÷]\s*$/,'');
  if(!parseAmount(v)&&!hasOp(v))return;
  el.value=v+' '+op+' ';
  el.dispatchEvent(new Event('input'));
  try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}
}

// posisi bar & pelari; animasi lari dari 0% saat Dashboard dibuka
function runnerPlace(p){   // p = persen yang sedang ditampilkan
  const svg=$('runSvg');if(!svg)return;
  const ach=+svg.dataset.ach,over=ach>=100,T=292;
  const fw=over?T:Math.max(32,Math.min(T,T*p/100));
  $('runFill').setAttribute('width',fw);
  const pt=$('runPct');
  if(fw>=70){pt.setAttribute('x',22);pt.setAttribute('fill','#fff');}else{pt.setAttribute('x',4+fw+28);pt.setAttribute('fill','#111');}
  const flagX=over?Math.max(40,4+T*100/ach):284;
  const fl=$('runFlag');fl.setAttribute('transform','translate('+flagX+',14)');
  fl.setAttribute('stroke',over?'#bbb':'#111');fl.querySelector('path').setAttribute('fill',over?'#bbb':'#111');
  $('runFlagT').setAttribute('x',flagX-18);$('runFlagT').style.display=over?'none':'';
  const mx=over?Math.min(270,Math.max(flagX+40,4+fw-34)):Math.min(262,Math.max(20,4+fw-1));
  $('runMan').setAttribute('transform','translate('+mx+',2)');
}
function runnerAnimate(){
  const svg=$('runSvg');if(!svg)return;
  const ach=+svg.dataset.ach;
  if(S.runDone||ach>=100||!window.requestAnimationFrame){runnerPlace(ach);return;}
  S.runDone=true;
  const t0=performance.now(),dur=1100;
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);if(!$('runSvg'))return;runnerPlace(ach*e);if(k<1)requestAnimationFrame(step);};
  runnerPlace(0);requestAnimationFrame(step);
}

// =====================================================
function cachedAll(prefix){
  const out=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(prefix)===0){const v=JSON.parse(localStorage.getItem(k)||'null');if(v)out.push(v);}}}catch(e){}
  return out;
}
function wordBank(kind){
  const cnt={},add=w=>{w=String(w||'').trim();if(!w)return;const k=w.toLowerCase();if(!cnt[k])cnt[k]={w:w,n:0};cnt[k].n++;};
  const br=JSON.stringify(S.branch);
  if(kind==='bel'){
    const seen={};
    cachedAll('jst2:getBelanja:['+br).concat(Object.values(S.bel)).forEach(b=>{if(b&&b.branch===S.branch)(b.items||[]).forEach(i=>{if(!seen[i.id]){seen[i.id]=1;add(i.name);}});});
  }else if(kind==='ren'){
    const seen={};
    Object.values(S.ren).concat(cachedAll('jst2:getRencana:')).forEach(r=>{if(r)(r.items||[]).forEach(i=>{if(!seen[i.id]){seen[i.id]=1;add(i.name);}});});
  }else{
    const months={};
    cachedAll('jst2:getMonth:['+br).forEach(m=>{if(m&&m.month)months[m.month]=m;});
    Object.values(S.months).forEach(m=>{if(m&&m.branch===S.branch)months[m.month]=m;});
    Object.values(months).forEach(m=>{
      if(kind==='note')m.days.forEach(x=>String(x.note||'').split(' · ').forEach(add));
      else (m.luar&&m.luar.entries||[]).forEach(e=>add(e.ket));
    });
  }
  // nama produk dari Data produk = sumber saran utama
  const prods={};
  prodItems().forEach(p=>{const w=String(p.name||'').trim();if(!w)return;const k=w.toLowerCase();if(prods[k])return;prods[k]={w:w,n:cnt[k]?cnt[k].n:0,p:p};delete cnt[k];});
  return Object.values(prods).sort((a,b)=>b.n-a.n||a.w.localeCompare(b.w)).concat(Object.values(cnt).sort((a,b)=>b.n-a.n||a.w.localeCompare(b.w)));
}
function eatClick(){const f=e=>{e.preventDefault();e.stopPropagation();};document.addEventListener('click',f,true);setTimeout(()=>document.removeEventListener('click',f,true),450);}
// Saran tampil tepat setelah kolom (urutan di halaman), jadi tombol ˅ / ˄ di atas
// keyboard iPad (dan panah ↓ ↑ di keyboard fisik) bisa pindah ke saran. Enter = pilih.
function attachSuggest(el,kind,onPick,showEmpty){
  if(!el)return;
  const host=el.parentNode;if(getComputedStyle(host).position==='static')host.style.position='relative';
  const dd=document.createElement('div');dd.className='sugdd hide';el.insertAdjacentElement('afterend',dd);
  let list=[];
  const hide=()=>dd.classList.add('hide');
  const inside=()=>dd.contains(document.activeElement)||document.activeElement===el;
  const pick=i=>{
    el.value=list[i].w;hide();
    el.dispatchEvent(new Event('input',{bubbles:true}));hide();
    if(document.activeElement!==el)el.dispatchEvent(new Event('blur'));  // simpan perubahan nama (kolom sudah tidak fokus)
    if(onPick)onPick(list[i]);else el.focus();
  };
  const show=()=>{
    const q=el.value.trim().toLowerCase();
    if(!q&&!showEmpty){hide();return;}
    list=wordBank(kind).filter(x=>x.w.toLowerCase()!==q&&(!q||x.w.toLowerCase().indexOf(q)>=0));
    // kosong = riwayat dulu; sedang mengetik = produk dulu, yang diawali huruf yang sama paling atas
    if(!q)list.sort((a,b)=>b.n-a.n);
    else list.sort((a,b)=>(b.p?1:0)-(a.p?1:0)||(b.w.toLowerCase().indexOf(q)===0?1:0)-(a.w.toLowerCase().indexOf(q)===0?1:0));
    list=list.slice(0,5);
    if(!list.length){hide();return;}
    dd.innerHTML=list.map((x,i)=>'<div class="sgr"><input class="sgi" data-i="'+i+'" value="'+esc(x.w)+'" enterkeyhint="done" autocomplete="off" aria-label="Saran: '+esc(x.w)+'"><small'+(x.p?' class="sp"':'')+'>'+(x.p?'produk':x.n+'×')+'</small></div>').join('');
    dd.querySelectorAll('.sgi').forEach(inp=>{
      const i=+inp.dataset.i;
      inp.addEventListener('beforeinput',e=>e.preventDefault());
      inp.addEventListener('focus',()=>{inp.parentNode.classList.add('on');try{inp.setSelectionRange(inp.value.length,inp.value.length);}catch(e){}});
      inp.addEventListener('blur',()=>{inp.parentNode.classList.remove('on');setTimeout(()=>{if(!inside())hide();},120);});
      inp.addEventListener('keydown',e=>{
        if(e.key==='Enter'||e.key==='Tab'&&false){e.preventDefault();pick(i);}
        else if(e.key==='ArrowDown'){e.preventDefault();const n=dd.querySelector('.sgi[data-i="'+(i+1)+'"]');if(n)n.focus();}
        else if(e.key==='ArrowUp'){e.preventDefault();const n=dd.querySelector('.sgi[data-i="'+(i-1)+'"]');(n||el).focus();}
        else if(e.key==='Escape'){hide();el.focus();}
      });
      inp.addEventListener('pointerup',e=>{e.preventDefault();eatClick();pick(i);});
    });
    dd.classList.remove('hide');
  };
  el.setAttribute('autocomplete','off');el.setAttribute('autocapitalize','sentences');
  el.addEventListener('input',show);el.addEventListener('focus',show);
  el.addEventListener('blur',()=>setTimeout(()=>{if(!inside())hide();},150));
  el.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'&&!dd.classList.contains('hide')){e.preventDefault();const f=dd.querySelector('.sgi');if(f)f.focus();}
    else if(e.key==='Enter'||e.key==='Escape')hide();
  });
}

// ---- simpan per kotak (aman untuk offline & dua perangkat) ----
const nf=v=>String(v||'').replace(/[^\d+\-]/g,'');
const cap1=v=>{v=String(v||'').trim();return v?v.charAt(0).toUpperCase()+v.slice(1):v;};  // huruf pertama kapital
// Omzet: tambahan di belakang (mis. "+ 200.000") dikirim sebagai transaksi baru.
// Kalau angka lama diubah, transaksi lama diganti.
function incomeOps(branch,date,inc,el){
  const ops=[],amt=parseAmount(el.value),fx=fOf(el)||fmtIn(amt);
  const T=nf(fx),O=nf(inc.map(i=>i.f||String(i.amount)).join('+'));
  if(T===O||(!inc.length&&!amt))return ops;
  if(inc.length&&O&&T.indexOf(O)===0&&T.charAt(O.length)==='+'){
    const d=T.slice(O.length+1),da=parseAmount(d);
    if(da>0)ops.push(['addIncome',[{id:uid(),branch:branch,date:date,amount:da,f:hasOp(d)?fmtExpr(d).trim():''}]]);
    return ops;
  }
  if(!inc.length){ops.push(['addIncome',[{id:uid(),branch:branch,date:date,amount:amt,f:fOf(el)}]]);return ops;}
  if(amt>0){ops.push(['updateIncome',[inc[0].id,amt,fOf(el)]]);inc.slice(1).forEach(i=>ops.push(['deleteIncome',[i.id]]));}
  else inc.forEach(i=>ops.push(['deleteIncome',[i.id]]));
  return ops;
}
function fieldOps(branch,date,x,vals){
  const ops=[];x=x||{};
  DKEYS.forEach(k=>{
    const v=vals[k],f=vals[k+'F']||'';
    if(v===undefined)return;
    if(v!==Number(x[k]||0)||f!==(x[FK[k]]||''))ops.push(['setDayField',[{branch:branch,date:date,field:k,value:v,f:f}]]);
  });
  if(vals.emp!==undefined&&vals.emp!==Number(x.emp||0))ops.push(['setDayField',[{branch:branch,date:date,field:'emp',value:vals.emp}]]);
  if(vals.note!==undefined&&vals.note!==(x.note||''))ops.push(['setDayField',[{branch:branch,date:date,field:'note',value:vals.note}]]);
  return ops;
}
function saveInput(){
  const btn=$('saveBtn');if(btn.disabled)return;
  const amt=parseAmount($('inOmz').value),dis=parseAmount($('inDis').value),bon=parseAmount($('inBon').value),exp=parseAmount($('inExp').value);
  if(S.inMode==='toko'){
    const x=dayData(S.inDate),ex=dayHasData(x);
    const note=cap1($('inNote')?$('inNote').value:'');
    if(!ex&&!amt&&!dis&&!bon&&!exp&&!S.emp&&!note){inMsg('Masukkan nominal terlebih dahulu.');return;}
    const ops=incomeOps(S.branch,S.inDate,x&&x.incomes?x.incomes:[],$('inOmz')).concat(
      fieldOps(S.branch,S.inDate,x,{discount:dis,discountF:fOf($('inDis')),bonus:bon,bonusF:fOf($('inBon')),expense:exp,expenseF:fOf($('inExp')),emp:S.emp,note:note}));
    S.formDirty=false;S.formKey='';
    if(ops.length)enqueue(ops);else updateInputData();
    inMsg(ops.length?'✓ Tersimpan':'Tidak ada perubahan.',true);if(ops.length)saveFx();
  }else{
    if(!amt){inMsg('Isi nominal luar toko terlebih dahulu.');return;}
    enqueue(['addLuar',[{id:uid(),branch:S.branch,month:S.luarMonth,ket:cap1($('inKet').value),amount:amt,discount:dis,bonus:bon,expense:exp}]]);
    ['inOmz','inDis','inBon','inExp'].forEach(id=>{$(id).value='0';$(id).dataset.f='';$(id).classList.remove('expr');});
    $('inKet').value='';updatePreview();
    inMsg('✓ Tersimpan',true);saveFx();
  }
}

  '</div></div>'+
  '<div class="fpanel'+(S.belTab==='renc'?'':' hide')+'" id="tp_bel_renc"></div>';

function loadBel(tok){

function belSetYear(y){S.belYear=y;S.belMonth=y===+S.today.slice(0,4)?S.today.slice(0,7):y+'-12';renderTop();renderBel();loadBel(S.tok);}
function belShift(d){
  const m=shiftMonth(S.belMonth,d);

  S.belAnim=d>0?'slL':'slR';
  S.belMonth=m;

  renderBel();
}
function belItems(month){const b=belData();return b?b.items.filter(i=>i.date.slice(0,7)===month):[];}
const belCount=it=>!it.bon; // Bon tidak masuk total, walaupun sudah Done
function belNewDate(){const mk=S.belMonth;if(S.today.slice(0,7)===mk)return S.today;return mk+'-'+String(new Date(+mk.slice(0,4),+mk.slice(5,7),0).getDate()).padStart(2,'0');}
function renderBelSafe(){
  const b=$('belBody');

  renderBel();
}
function renderBel(){
  if(!$('belBody'))return;

  $('belNext').innerHTML=canNext?MF[+next.slice(5,7)-1]+ic('right'):'';

  const b=belData();

  // baris kosong untuk input baru (selalu di paling atas)

  const nd=S.belNew.date||belNewDate();
  h+='<tr class="bnew"><td><input type="date" class="bdate" id="bnDate" value="'+nd+'" max="'+S.today+'" onchange="belPickDate(this.value)"></td>'+
     '<td><input class="bc" id="bnName" placeholder="Ketik nama barang..." enterkeyhint="next" maxlength="150"></td>'+
     '<td><div class="bnum'+(S.belNew.bon?' bonv':'')+'"><span>Rp</span><input class="bc" id="bnAmt" inputmode="decimal" placeholder="0" enterkeyhint="done"></div></td>'+
     '<td><div class="bst"><button class="'+(S.belNew.bon?'red':'')+'" onclick="belNewTog(\'bon\')">Bon</button><button class="'+(S.belNew.done?'grn':'')+'" onclick="belNewTog(\'done\')">Done</button></div></td></tr>';
  if(!b){h+='<tr><td colspan="4" class="bempty">Memuat data...</td></tr>';}
  else{
    const items=belItems(mk);
    const days={};items.forEach(it=>{(days[it.date]=days[it.date]||[]).push(it);});
    const keys=Object.keys(days).sort().reverse();   // hari terbaru di atas
    if(!keys.length)h+='<tr><td colspan="4" class="bempty">Belum ada belanja di '+MF[mo-1]+' '+y+'.</td></tr>';

      list.forEach((it,i)=>{

          '<td><input class="bc bn" value="'+esc(it.name)+'" data-o="'+esc(it.name)+'" enterkeyhint="next" maxlength="150"></td>'+
          '<td><div class="bnum'+(it.bon?' bonv':'')+'"><span>Rp</span><input class="bc bv" inputmode="decimal" value="'+(fmtIn(it.amount)||'0')+'" data-f="'+esc(it.f||'')+'" data-o="'+it.amount+'" data-of="'+esc(it.f||'')+'" enterkeyhint="next"></div></td>'+
          '<td><div class="bst"><button class="'+(it.bon?'red':'')+(S.popKey===it.id+'bon'?' pop':'')+'" onclick="belTog(\''+it.id+'\',\'bon\')">Bon</button><button class="'+(it.done?'grn':'')+(S.popKey===it.id+'done'?' pop':'')+'" onclick="belTog(\''+it.id+'\',\'done\')">Done</button></div></td></tr>';
      });
      h+='<tr class="btot" style="background:'+tint+'"><td></td><td>Total belanja</td><td class="r" data-dt="'+k+'"></td><td></td></tr>';
    });
  }

  if(b&&S.flash&&b.items.some(i=>i.id===S.flash))S.flash='';
  if(S.belAnim){tb.classList.remove('slL','slR');void tb.offsetWidth;tb.classList.add(S.belAnim);S.belAnim='';}
  // baris baru
  const nn=$('bnName'),na=$('bnAmt');

    v.addEventListener('blur',()=>setTimeout(()=>belCommitAmt(id,v),0));
    n.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();v.focus();}});
    v.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();belNextCell(tr);}});

}

// ---- diagram belanja: per bulan & per minggu (Bon tidak dihitung) ----
function belSumBy(year,fn){const b=S.bel[S.branch+'|'+year];if(!b)return null;const o={};b.items.forEach(i=>{if(!belCount(i))return;const k=fn(i);if(k!=null)o[k]=(o[k]||0)+i.amount;});return o;}
const belWeek=d=>Math.min(4,Math.ceil(+d.slice(8,10)/7));   // 1–7, 8–14, 15–21, 22–akhir
function renderBelCharts(){
  const cm=$('belChM'),cw=$('belChW');if(!cm||!cw)return;
  const y=S.belYear,mk=S.belMonth,mo=+mk.slice(5,7);
  // per bulan
  const pm=belSumBy(y,i=>+i.date.slice(5,7));
  if(!pm){cm.innerHTML='<div class="sub">Memuat diagram...</div>';cw.innerHTML='';return;}
  const vals=Array.from({length:12},(_,i)=>pm[i+1]||0),mx=Math.max(1,...vals),yr=vals.reduce((a,b)=>a+b,0);
  const H=120;
  cm.innerHTML='<div class="hd"><b style="font-size:15px">Belanja per bulan · '+y+'</b><span class="sub">Total setahun '+rp(yr)+'</span></div>'+
    '<div class="bch" style="height:'+(H+22)+'px">'+vals.map((v,i)=>{const h=v?Math.max(3,Math.round(v/mx*H)):0;
      return '<button class="bcol'+(i+1===mo?' on':'')+'" onclick="belGoMonth('+(i+1)+')" aria-label="'+MF[i]+' '+rp(v)+'">'+(v?'<span>'+short(v)+'</span>':'')+'<b style="height:'+h+'px"></b></button>';}).join('')+'</div>'+
    '<div class="bml">'+MN.map((m,i)=>'<div class="'+(i+1===mo?'on':'')+'">'+m+'</div>').join('')+'</div>'+
    '<div class="sub" style="margin-top:6px">Ketuk batang untuk membuka bulan itu</div>'+
    '<div class="bmlist">'+vals.map((v,i)=>{const k=y+'-'+String(i+1).padStart(2,'0');if(k>S.today.slice(0,7))return '';
      return '<button class="'+(i+1===mo?'on':'')+'" onclick="belGoMonth('+(i+1)+')"><span>'+MF[i]+'</span><b>'+rp(v)+'</b></button>';}).join('')+'</div>';
  // per minggu: bulan ini vs bulan lalu
  const pk=shiftMonth(mk,-1),py=+pk.slice(0,4);
  if(!S.bel[S.branch+'|'+py]&&py!==y&&!S.belLoadingPrev){S.belLoadingPrev=1;load('getBelanja',[S.branch,py],d=>{S.bel[S.branch+'|'+py]=d;S.belLoadingPrev=0;if(S.page==='bel')renderBelCharts();});}
  const wc=belSumBy(y,i=>i.date.slice(0,7)===mk?belWeek(i.date):null)||{};
  const wp=belSumBy(py,i=>i.date.slice(0,7)===pk?belWeek(i.date):null)||{};
  const dim=new Date(+mk.slice(0,4),mo,0).getDate();
  const rng=['1–7','8–14','15–21','22–'+dim];
  const wmx=Math.max(1,...[1,2,3,4].map(w=>Math.max(wc[w]||0,wp[w]||0)));
  const pct=(a,b)=>!b?(a?'baru':'—'):((a-b)/b*100>=0?'+':'')+Math.round((a-b)/b*100)+'%';
  const pc=(a,b)=>!b||a===b?'var(--ink3)':(a>b?'var(--red)':'var(--green)');
  const pName=MF[+pk.slice(5,7)-1];
  cw.innerHTML='<div class="hd"><b style="font-size:15px">Belanja per minggu · '+MF[mo-1]+' '+mk.slice(0,4)+'</b><span class="sub">vs '+pName+'</span></div>'+
    '<div class="bwk" style="height:'+(H+22)+'px">'+[1,2,3,4].map(w=>{const a=wc[w]||0,b=wp[w]||0,ha=a?Math.max(3,Math.round(a/wmx*H)):0,hb=b?Math.max(3,Math.round(b/wmx*H)):0;
      return '<div class="bwg"><div class="bcol dim">'+(b?'<span>'+short(b)+'</span>':'')+'<b style="height:'+hb+'px"></b></div><div class="bcol on">'+(a?'<span>'+short(a)+'</span>':'')+'<b style="height:'+ha+'px"></b></div></div>';}).join('')+'</div>'+
    '<div class="bml" style="gap:14px;padding:0 6px">'+[1,2,3,4].map(w=>'<div>Minggu '+w+'<br><span class="sub">'+rng[w-1]+'</span></div>').join('')+'</div>'+
    '<div class="blg"><span><i style="background:var(--ink)"></i>'+MF[mo-1]+'</span><span><i style="background:var(--line2)"></i>'+pName+'</span></div>'+
    '<table class="bwt"><thead><tr><th>Minggu</th><th>'+MF[mo-1]+'</th><th>'+pName+'</th><th>Selisih</th></tr></thead><tbody>'+
    [1,2,3,4].map(w=>{const a=wc[w]||0,b=wp[w]||0;return '<tr><td>Minggu '+w+'</td><td>'+rp(a)+'</td><td>'+rp(b)+'</td><td style="color:'+pc(a,b)+';font-weight:700">'+pct(a,b)+'</td></tr>';}).join('')+
    (()=>{const a=[1,2,3,4].reduce((s,w)=>s+(wc[w]||0),0),b=[1,2,3,4].reduce((s,w)=>s+(wp[w]||0),0);return '<tr class="t"><td>Total</td><td>'+rp(a)+'</td><td>'+rp(b)+'</td><td style="color:'+pc(a,b)+'">'+pct(a,b)+'</td></tr>';})()+
    '</tbody></table>';
}
function belGoMonth(m){
  const mk=S.belYear+'-'+String(m).padStart(2,'0');
  if(mk>S.today.slice(0,7)||mk===S.belMonth)return;
  S.belAnim=mk<S.belMonth?'slR':'slL';S.belMonth=mk;renderBel();
  const bx=$('belBox');if(bx)bx.scrollIntoView({behavior:'smooth',block:'start'});
}
function belNextCell(tr){
  let nx=tr.nextElementSibling;while(nx&&!nx.dataset.id)nx=nx.nextElementSibling;
  if(nx)nx.querySelector('.bn').focus();else document.activeElement.blur();
}
function belTotals(){
  const items=belItems(S.belMonth),dt={};let tot=0;
  items.forEach(it=>{if(belCount(it)){dt[it.date]=(dt[it.date]||0)+it.amount;tot+=it.amount;}});
  document.querySelectorAll('#belBody [data-dt]').forEach(td=>td.textContent=rp(dt[td.dataset.dt]||0));
  $('belSumL').textContent='Total belanja '+MF[+S.belMonth.slice(5,7)-1]+' '+S.belMonth.slice(0,4);
  $('belSum').textContent=rp(tot);
  renderBelCharts();
}
function belPickDate(v){
  if(!v)return;if(v>S.today){alert('Tanggal belum lewat.');v=S.today;}
  S.belNew.date=v;S.belAct=Date.now();
  const mk=v.slice(0,7);
  if(mk!==S.belMonth){   // tampilkan bulan dari tanggal yang dipilih
    S.belAnim=mk<S.belMonth?'slR':'slL';S.belMonth=mk;
    if(+mk.slice(0,4)!==S.belYear){S.belYear=+mk.slice(0,4);renderTop();renderBel();loadBel(S.tok);}else renderBel();
  }else{const d=$('bnDate');if(d)d.value=v;}
  setTimeout(()=>{const n=$('bnName');if(n)n.focus();},50);
}
// 1 menit tanpa aktivitas → tanggal input kembali ke hari ini
['pointerdown','keydown','input'].forEach(ev=>document.addEventListener(ev,()=>{if(S.page==='bel')S.belAct=Date.now();},true));
setInterval(()=>{
  if(S.page!=='bel'||!S.belNew.date||S.belNew.date===S.today)return;
  if(Date.now()-(S.belAct||0)<60000)return;
  const b=$('belBody');if(b&&b.contains(document.activeElement))return;
  S.belNew.date=null;
  if(S.belMonth!==S.today.slice(0,7)){S.belMonth=S.today.slice(0,7);if(S.belYear!==+S.today.slice(0,4)){S.belYear=+S.today.slice(0,4);renderTop();loadBel(S.tok);}}
  renderBel();
},5000);
function belNewTog(k){S.belNew[k]=!S.belNew[k];const keep={n:$('bnName').value,a:$('bnAmt').value};renderBel();$('bnName').value=keep.n;$('bnAmt').value=keep.a;}
function belAdd(){
  const name=cap1($('bnName').value),el=$('bnAmt'),amt=parseAmount(el.value),date=$('bnDate').value||belNewDate();
  if(!name&&!amt){$('bnName').focus();return;}
  if(date>S.today){alert('Tanggal belum lewat.');return;}
  S.belNew.date=date;S.belAct=Date.now();
  if(date.slice(0,7)!==S.belMonth){S.belMonth=date.slice(0,7);if(+date.slice(0,4)!==S.belYear){S.belYear=+date.slice(0,4);renderTop();loadBel(S.tok);}}
  const nid=uid();S.flash=nid;
  enqueue(['upsertBelanja',[{id:nid,branch:S.branch,date:date,name:name,amount:amt,f:fOf(el),bon:!!S.belNew.bon,done:!!S.belNew.done}]]);
  S.belNew.bon=false;S.belNew.done=false;
  renderBel();
  $('bnName').focus();
}
function belFind(id){const b=belData();return b?b.items.find(i=>i.id===id):null;}
function belCommitName(id,el){
  const v=cap1(el.value);if(el.value!==v)el.value=v;if(v===el.dataset.o)return;
  el.dataset.o=v;
  enqueue(['upsertBelanja',[{id:id,name:v}]]);
}
function belCommitAmt(id,el){
  const amt=parseAmount(el.value),f=fOf(el);
  if(amt===+el.dataset.o&&(f||'')===(el.dataset.of||''))return;
  if(!amt){
    if(confirm('Hapus belanja ini?')){enqueue(['deleteBelanja',[id]]);S.belPending=true;return;}
    const it=belFind(id);setNum(el,it?it.amount:0,it?it.f:'');return;
  }
  el.dataset.o=amt;el.dataset.of=f||'';
  enqueue(['upsertBelanja',[{id:id,amount:amt,f:f}]]);
}
function belTog(id,k){
  const it=belFind(id);if(!it)return;
  const p={id:id};p[k]=!it[k];S.popKey=id+k;
  enqueue(['upsertBelanja',[p]]);
}

// TAB MAP (Belanja: Rekap / Rencana · Database: Data penjualan / Data produk)
// =====================================================
const TABS={bel:{key:'belTab',list:[['rekap','Rekap belanja','bag'],['renc','Rencana belanja','cal']]},
            db:{key:'dbTab',list:[['jual','Data penjualan','bars'],['produk','Data produk','box']]}};
function ftabsHTML(name){
  const T=TABS[name],act=S[T.key];
  return '<div class="ftabs" id="ft_'+name+'" role="tablist">'+T.list.map(t=>'<button role="tab" class="'+(t[0]===act?'on':'')+'" onclick="setTab(\''+name+'\',\''+t[0]+'\')">'+ic(t[2])+'<span>'+t[1]+'</span></button>').join('')+'</div>';

function setTab(name,k){
  const T=TABS[name],order=T.list.map(t=>t[0]);
  if(S[T.key]===k)return;
  const dir=order.indexOf(k)>order.indexOf(S[T.key])?'fxL':'fxR';
  S[T.key]=k;
  document.querySelectorAll('#ft_'+name+' button').forEach((b,i)=>b.classList.toggle('on',order[i]===k));
  order.forEach(o=>{const p=$('tp_'+name+'_'+o);if(!p)return;p.classList.toggle('hide',o!==k);
    if(o===k){p.classList.remove('fxL','fxR');void p.offsetWidth;p.classList.add(dir);}});
  renderTop();
  if(name==='bel'){if(k==='renc'){renderRen();loadRen(S.tok);loadProd();}else renderBel();}
  if(name==='db'&&k==='produk'){renderProd();loadProd(true);}
  if(window.scrollY>80)window.scrollTo({top:0,behavior:'smooth'});
}

// ---- angka jumlah (boleh koma: 1,5 kodi) ----
const parseQty=v=>{const n=Number(String(v==null?'':v).replace(/\./g,'').replace(',','.').replace(/[^\d.]/g,''));return isFinite(n)?Math.round(n*100)/100:0;};
const fmtQ=n=>n?String(n).replace('.',','):'';
function bindQty(el,onChange){
  el.addEventListener('focus',()=>{if(!parseQty(el.value))el.value='';});
  el.addEventListener('input',()=>{const v=el.value.replace(/[^\d,]/g,'').replace(/,(?=.*,)/g,'');if(v!==el.value)el.value=v;if(onChange)onChange();});
}

// DATA PRODUK (dipakai bersama Blok F & Blok B)
// =====================================================
function prodItems(){const p=S.prod||withPending('getProduk',clone(getCached('getProduk',[])));return p&&p.items?p.items:[];}
function prodFind(name){const k=String(name||'').trim().toLowerCase();if(!k)return null;return prodItems().find(p=>p.name.trim().toLowerCase()===k)||null;}
function loadProd(force){
  if(S.prodLoading||(S.prod&&!force))return;
  S.prodLoading=1;
  load('getProduk',[],d=>{S.prod=d;S.prodLoading=0;if(S.page==='db'&&S.dbTab==='produk'){renderProdSafe();renderTop();}}).then(()=>{S.prodLoading=0;if(!S.prod&&!getCached('getProduk',[])){S.prod=applyProdOps({items:[]});if(S.page==='db'&&S.dbTab==='produk')renderProdSafe();}});

// harga beli untuk rencana: kalau salah satu kosong, 1 kodi = 20 pcs
const hk20=p=>p.bk||(p.bs?p.bs*20:0),hs20=p=>p.bs||(p.bk?Math.round(p.bk/20):0);
const profitPct=(b,j)=>b>0&&j>0?(j-b)/b*100:null;
const marginPct=(b,j)=>b>0&&j>0?(j-b)/j*100:null;   // margin = untung dibanding harga jual
function marginCell(b,j,id){const m=marginPct(b,j);return '<td class="pmg'+(m!==null&&m<0?' neg':'')+'"'+(id?' id="'+id+'"':'')+'>'+(m===null?'<span class="cn">–</span>':'<b>'+pctTxt(m)+'</b>')+'</td>';}
const per20=k=>k?Math.round(k/20):0;   // 1 kodi = 20 pcs
function profitCell(b,j,id){
  if(!(b>0&&j>0))return '<td class="pf"'+(id?' id="'+id+'"':'')+'><span class="cn">–</span></td>';
  const d=j-b,p=d/b*100;
  return '<td class="pf '+(d<0?'neg':'')+'"'+(id?' id="'+id+'"':'')+'><b>'+rp(d)+'</b><small>'+pctTxt(p)+'</small></td>';

function renderProdSafe(){const b=$('prodBody');if(b&&b.contains(document.activeElement)){S.prodPending=true;renderProdFoot();return;}renderProd();}
function renderProd(){
  const el=$('tp_db_produk');if(!el)return;
  if(!$('prodBody')){
    el.innerHTML=
    '<div style="display:flex;flex-direction:column;gap:12px">'+
      '<div class="card bd"><div class="hd"><div><div style="font-size:17px;font-weight:800">Data produk</div><div class="sub" id="prodCnt"></div></div></div>'+

  list.forEach(p=>{
    h+='<tr data-id="'+p.id+'"'+(S.flash===p.id?' class="flash"':'')+'><td class="p1"><input class="bc pn" value="'+esc(p.name)+'" data-o="'+esc(p.name)+'" maxlength="150" enterkeyhint="next"></td>'+

  });

    $('pnPs').outerHTML=profitCell(v[0],v[2],'pnPs');$('pnPk').outerHTML=profitCell(v[1],v[3],'pnPk');
    $('pnMs').outerHTML=marginCell(v[0],v[2],'pnMs');$('pnMk').outerHTML=marginCell(v[1],v[3],'pnMk');};
  const order=[f[1],f[0],f[2],f[3]];
  f.forEach((e,i)=>{bindNum(e,()=>{
      if(gen!==S.prodGen)return;
      if(i===1&&!f[0].dataset.man){const k=parseAmount(f[1].value);f[0].value=k?fmtIn(per20(k)):'';}
      prev();},true);e.value='';
    if(i===0)e.addEventListener('input',()=>{e.dataset.man=parseAmount(e.value)?'1':'';});   // satuan diketik sendiri
    e.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();const j=order.indexOf(e);if(j<3){order[j+1].focus();try{order[j+1].select();}catch(_){}}else prodAdd();}});});
  nn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();f[1].focus();}});

    n.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();c[1].focus();}});
    // harga beli satuan ikut kodian ÷ 20, selama satuan belum diubah sendiri

    c[1].addEventListener('focus',()=>{const it=prodItems().find(x=>x.id===id);autoS=!!it&&(!it.bs||it.bs===per20(it.bk));});
    c.forEach((e,i)=>{bindNum(e,i===1?()=>{if(autoS){const k=parseAmount(c[1].value);c[0].value=k?fmtIn(per20(k)):'';}}:null,true);if(!+e.dataset.o)e.value='';
      e.addEventListener('blur',()=>setTimeout(()=>{prodCommitNum(id,['bs','bk','js','jk'][i],e);if(i===1&&autoS)prodCommitNum(id,'bs',c[0]);},0));
      e.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();const j=ord.indexOf(e);if(j<3){ord[j+1].focus();try{ord[j+1].select();}catch(_){}}else{let nx=tr.nextElementSibling;if(nx&&nx.dataset.id)nx.querySelector('.pn').focus();else e.blur();}}});});
  });
  if(keep){const k=$(keep.id);if(k){k.value=keep.v;k.focus();try{k.setSelectionRange(k.value.length,k.value.length);}catch(_){}}}

function renderProdFoot(){
  const all=prodItems(),ft=$('prodFoot'),cnt=$('prodCnt');
  if(cnt)cnt.textContent=all.length+' produk · urut A–Z';
  if(!ft)return;
  const st=(bk,jk)=>{const xs=all.filter(p=>p[bk]>0&&p[jk]>0);if(!xs.length)return null;
    return {n:xs.length,pct:xs.reduce((s,p)=>s+(p[jk]-p[bk])/p[bk]*100,0)/xs.length,mg:xs.reduce((s,p)=>s+(p[jk]-p[bk])/p[jk]*100,0)/xs.length,rp:xs.reduce((s,p)=>s+(p[jk]-p[bk]),0)/xs.length};};
  const s=st('bs','js'),k=st('bk','jk');
  const ranked=all.map(p=>({p:p,v:profitPct(p.bs,p.js),u:'satuan'})).map(o=>o.v===null?{p:o.p,v:profitPct(o.p.bk,o.p.jk),u:'kodian'}:o).filter(o=>o.v!==null).sort((a,b)=>b.v-a.v);
  const hi=ranked[0],lo=ranked.length>1?ranked[ranked.length-1]:null;
  const box=(l,big,sub,cls)=>'<div class="pfb'+(cls?' '+cls:'')+'"><small>'+l+'</small><b>'+big+'</b><span>'+sub+'</span></div>';
  ft.innerHTML='<div class="hd"><b style="font-size:15px">Rata-rata keuntungan</b><span class="sub">'+all.length+' produk · persen besar = profit dari harga beli</span></div>'+
    '<div class="pfg">'+
      box('Satuan',s?pctTxt(s.pct):'–',s?'Margin '+pctTxt(s.mg)+' · '+rp(s.rp)+' per pcs · '+s.n+' produk':'Belum ada harga satuan')+
      box('Kodian',k?pctTxt(k.pct):'–',k?'Margin '+pctTxt(k.mg)+' · '+rp(k.rp)+' per kodi · '+k.n+' produk':'Belum ada harga kodian')+
      box(ic('trophy')+' Tertinggi',hi?esc(hi.p.name):'–',hi?pctTxt(hi.v)+' ('+hi.u+')':'',' tx')+
      box(ic('low')+' Terendah',lo?esc(lo.p.name):'–',lo?pctTxt(lo.v)+' ('+lo.u+')':'',' tx')+
    '</div>';
}
function prodAdd(){
  const name=cap1($('pnName').value),v=['pnBs','pnBk','pnJs','pnJk'].map(id=>parseAmount($(id).value));
  if(!name){$('pnName').focus();return;}
  const ex=prodFind(name);
  if(ex&&!confirm('Produk "'+ex.name+'" sudah ada. Tetap tambahkan lagi?'))return;
  const id=uid();S.flash=id;
  enqueue(['upsertProduk',[{id:id,name:name,bs:v[0],bk:v[1],js:v[2],jk:v[3]}]]);
  renderProd();
  const n=$('pnName');if(n)n.focus();
}
function prodCommitName(id,el){
  const v=cap1(el.value);if(el.value!==v)el.value=v;if(v===el.dataset.o)return;
  if(!v){
    if(confirm('Hapus produk "'+el.dataset.o+'"?')){enqueue(['deleteProduk',[id]]);S.prodPending=true;return;}
    el.value=el.dataset.o;return;
  }
  el.dataset.o=v;enqueue(['upsertProduk',[{id:id,name:v}]]);
}
function prodCommitNum(id,k,el){
  const a=parseAmount(el.value);if(!a)el.value='';
  if(a===+el.dataset.o)return;
  el.dataset.o=a;const p={id:id};p[k]=a;enqueue(['upsertProduk',[p]]);
  // profit di baris ini langsung ikut berubah
  const tr=el.closest('tr'),it=prodItems().find(x=>x.id===id);
  if(tr&&it){const tds=tr.querySelectorAll('td.pf');tds[0].outerHTML=profitCell(it.bs,it.js);tds[1].outerHTML=profitCell(it.bk,it.jk);
    const ms=tr.querySelectorAll('td.pmg');ms[0].outerHTML=marginCell(it.bs,it.js);ms[1].outerHTML=marginCell(it.bk,it.jk);}
}

function renData(){return S.ren[S.branch];}
function loadRen(tok){const br=S.branch;load('getRencana',[br],d=>{S.ren[d.branch]=d;if(S.page==='bel'&&S.belTab==='renc')renderRenSafe();})
  .then(()=>{if(!S.ren[br]){S.ren[br]=applyRenOps({branch:br,items:[]});if(S.page==='bel'&&S.belTab==='renc')renderRenSafe();}});}   // offline & belum pernah dibuka: mulai dari kosong
function renItems(date){const r=renData();return r?r.items.filter(i=>i.date===date):[];}
// harga kodian / satuan dengan cadangan 1 kodi = 20 pcs
const renHK=it=>it.hk||(it.hs?it.hs*20:0),renHS=it=>it.hs||(it.hk?Math.round(it.hk/20):0);
const renTot=it=>Math.round((it.k||0)*renHK(it)+(it.s||0)*renHS(it));
// harga yang ditampilkan: kodian kalau ada jumlah kodian, selain itu satuan
const renUnit=it=>(it.k>0||!(it.s>0)&&it.hk&&!it.hs)?'k':'s';
function renSetDate(v){
  if(!v)return;
  const dir=v>S.renDate?'fxL':'fxR';S.renDate=v;S.renNew=null;
  renderRen();
  const w=$('renBox');if(w){w.classList.remove('fxL','fxR');void w.offsetWidth;w.classList.add(dir);}
}
function renStripHTML(){
  const r=renData(),has={};if(r)r.items.forEach(i=>{has[i.date]=1;});

  }

}
function renderRenSafe(){const b=$('renBody');if(b&&b.contains(document.activeElement)){S.renPending=true;renTotals();const s=$('renStrip');if(s){s.innerHTML=renStripHTML();renStripScroll();}return;}renderRen();}

  const el=$('tp_bel_renc');if(!el)return;

  S.renNew=S.renNew||{hk:0,hs:0,manual:false};

    '<div class="belbox" id="renBox">'+
      '<div class="btwrap rwrap"><table class="btab rtab"><colgroup><col class="r1"><col class="r2"><col class="r2"><col class="r3"><col class="r4"></colgroup>'+
      '<thead><tr><th rowspan="2">Nama barang</th><th colspan="2" class="c">Jumlah</th><th rowspan="2" class="r">Harga</th><th rowspan="2" class="r">Total</th></tr>'+
      '<tr class="h2"><th class="c">Kodian</th><th class="c">Satuan</th></tr></thead>'+
      '<tbody id="renBody"></tbody>'+
      '<tfoot><tr class="rtot"><td>Total <span class="sub" id="renCnt"></span></td><td class="c" id="renSK"></td><td class="c" id="renSS"></td><td></td><td class="r" id="renSum">Rp0</td></tr></tfoot></table></div>'+

    '</div>'+
  '</div>';
  const tb=$('renBody');
  const qty=(cls,v,id)=>'<td><input class="bc rq '+cls+'"'+(id?' id="'+id+'"':'')+' inputmode="decimal" value="'+fmtQ(v)+'" placeholder="0" data-o="'+(v||0)+'" enterkeyhint="next"></td>';

      qty('rk',it.k)+qty('rs',it.s)+
      '<td><div class="bnum"><span>Rp</span><input class="bc rh" inputmode="decimal" value="'+fmtIn(u==='k'?renHK(it):renHS(it))+'" placeholder="0" data-o="'+(u==='k'?renHK(it):renHS(it))+'" enterkeyhint="next"></div>'+
      '<div class="ru">per '+(u==='k'?'kodi':'pcs')+(both?' · pcs '+rp(renHS(it)):'')+'</div></td>'+

  });
  $('renBody').addEventListener('focusout',()=>setTimeout(()=>{const t=$('renBody');if(t&&S.renPending&&!t.contains(document.activeElement))renderRen();},60));

}
function renStripScroll(){const st=$('renStrip'),on=st&&st.querySelector('.rsd.on');if(on)st.scrollLeft=on.offsetLeft-st.clientWidth/2+on.offsetWidth/2;}
function renTotals(){
  const items=renItems(S.renDate);let sk=0,ss=0,tot=0;

function renAdd(){
  const name=cap1($('rnName').value),k=parseQty($('rnK').value),s=parseQty($('rnS').value);
  if(!name){$('rnName').focus();return;}
  const u=renUnit({k:k,s:s,hk:S.renNew.hk,hs:S.renNew.hs}),typed=parseAmount($('rnH').value);
  let hk=S.renNew.hk||0,hs=S.renNew.hs||0;

  enqueue(['upsertRencana',[{id:id,branch:S.branch,date:S.renDate,name:name,k:k,s:s,hk:hk,hs:hs}]]);

function renFind(id){const r=renData();return r?r.items.find(i=>i.id===id):null;}
function renCommitName(id,el){
  const v=cap1(el.value);if(el.value!==v)el.value=v;if(v===el.dataset.o)return;
  if(!v){if(confirm('Hapus rencana "'+el.dataset.o+'"?')){enqueue(['deleteRencana',[id]]);S.renPending=true;return;}el.value=el.dataset.o;return;}
  el.dataset.o=v;const p={id:id,name:v},it=renFind(id),pr=prodFind(v);

function renCommitQty(id,key,el){
  const v=parseQty(el.value);el.value=fmtQ(v);

const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
// dipanggil setiap selesai render halaman: animasi masuk hanya sekali per kunjungan
function fx(page){
  const m=$({dash:'pDash',input:'pInput',bel:'pBel',db:'pDb'}[page]);if(!m)return;
  if(S.enter===page&&!RM){
    S.enter='';m.classList.add('fx');m._fx0=performance.now();clearTimeout(m._fx);m._fx=setTimeout(()=>m.classList.remove('fx'),1200);
    m.querySelectorAll('[data-cu]').forEach(countUp);
  }else if(m.classList.contains('fx')&&performance.now()-(m._fx0||0)<200){
    // render ulang tepat setelah masuk (data simpanan → data server): animasi tetap jalan
    m.querySelectorAll('[data-cu]').forEach(countUp);
  }
}
function countUp(el){
  const v=+el.dataset.cu;if(!v||!window.requestAnimationFrame)return;
  const t0=performance.now(),dur=750;
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);if(!el.isConnected)return;el.textContent=rp(v*e);if(k<1)requestAnimationFrame(step);};
  el.textContent=rp(0);requestAnimationFrame(step);
}
function bounceNav(id){const b=$(id);if(!b||RM)return;b.classList.remove('bounce');void b.offsetWidth;b.classList.add('bounce');}
function popEl(el){if(!el||RM)return;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}

function renderCmp(){
  const y=S.yearView||+S.month.slice(0,4),a=yd(y),b=yd(y-1),el=$('cCard');if(!el)return;
  if(!a||!b){el.innerHTML='<div style="padding:16px" class="sub">Memuat perbandingan...</div>';return;}
  const mode=S.cMode,va=a.map(x=>isFuture(x.month)?null:(mode==='o'?x.omzet:x.net)),vb=b.map(x=>mode==='o'?x.omzet:x.net);
  const maxV=Math.max(1,...va.filter(v=>v!==null).map(Math.abs),...vb.map(Math.abs)),H=160;
  let bars='';
  for(let i=0;i<12;i++){
    const x=va[i],z=vb[i];
    const hx=x?Math.max(3,Math.abs(x)/maxV*H):0,hz=z?Math.max(3,Math.abs(z)/maxV*H):0;
    bars+='<div class="gg"><div class="gbw">'+(x?'<span style="font-weight:700;color:var(--ink)">'+lblJ(x)+'</span>':'')+'<div class="gb" style="height:'+hx+'px;background:'+(x<0?'#e3b4b4':'var(--ink)')+'"></div></div>'+
      '<div class="gbw">'+(z?'<span style="color:var(--ink2)">'+lblJ(z)+'</span>':'')+'<div class="gb" style="height:'+hz+'px;background:var(--bar2)"></div></div></div>';

// Format CSV: tanggal, omzet, diskon, bonus, pengeluaran, (emp opsional)
// Pemisah koma atau titik koma; angka boleh pakai titik ribuan; tanggal yyyy-mm-dd atau dd/mm/yyyy
function importCsv(input){
  const f=input.files&&input.files[0];if(!f)return;
  const msg=$('impMsg');msg.className='msg';msg.textContent='Membaca file...';
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const lines=String(ev.target.result||'').replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
      if(lines.length<2)throw new Error('File CSV tidak berisi data.');
      const sep=(lines[0].split(';').length>lines[0].split(',').length)?';':',';
      const records=[];
      lines.slice(1).forEach((line,i)=>{
        const c=line.split(sep).map(v=>v.trim().replace(/^"|"$/g,''));
        if(c.length<2)throw new Error('Format baris '+(i+2)+' tidak sesuai.');
        let d=c[0];
        const m1=d.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
        if(m1)d=m1[3]+'-'+m1[2].padStart(2,'0')+'-'+m1[1].padStart(2,'0');
        if(!/^\d{4}-\d{2}-\d{2}$/.test(d))throw new Error('Tanggal tidak valid di baris '+(i+2)+'.');
        const n=k=>parseAmount(c[k]);
        records.push({date:d,omzet:n(1),discount:n(2),bonus:n(3),expense:n(4),emp:n(5)});
      });
      msg.textContent='Mengimpor '+records.length+' baris...';
      callApi('importHistoricalData',[{branch:S.branch,records:records}]).then(res=>{
        msg.className='msg ok';msg.textContent='Selesai: '+res.imported+' hari masuk, '+res.skipped+' dilewati (sudah ada / tidak valid).';
        refresh();
      }).catch(e=>{msg.className='msg err';msg.textContent=e.message;});
    }catch(e){msg.className='msg err';msg.textContent=e.message;}
    input.value='';
  };
  r.onerror=()=>{msg.className='msg err';msg.textContent='Gagal membaca file.';};
  r.readAsText(f,'UTF-8');
}

// Tab = nama bulan; kolom dicari dari judul: TANGGAL, HIJAB/OMZET, DISKON,
