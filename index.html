<meta name="theme-color" content="#f2f2f4">
<title>J-STORE HIJAB</title>
<style>
:root{--bg:#f2f2f4;--card:#fff;--ink:#111;--ink2:#5c5c63;--ink3:#9a9aa2;--line:#e6e6ea;--soft:#f3f3f5;--bar2:#c4c4ca;--green:#1f7a3f;--greenbg:#e3f4e8;--red:#b42323;--redbg:#fde6e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif}
body{padding:14px 14px calc(100px + env(safe-area-inset-bottom))}
.app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:inherit}
.ic{width:1em;height:1em;vertical-align:-.14em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hide{display:none!important}

.title{text-align:center;padding-top:6px}
.title h1{margin:0;font-size:26px;font-weight:700;letter-spacing:1px}
.quote{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.5;padding:0 16px;cursor:pointer;user-select:none;-webkit-user-select:none}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.br{display:flex;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:3px;gap:2px}
.br button{padding:7px 16px;border-radius:18px;font-size:14px;font-weight:600;color:var(--ink2)}
.br button.on{background:var(--ink);color:#fff}
.pillbtn{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:500;overflow:hidden}
.pillbtn input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;-webkit-appearance:none;appearance:none}

.card{background:var(--card);border-radius:14px;padding:14px}
.card.bd{border:1px solid var(--line)}
.card.np{padding:0;overflow:hidden}
.lbl{font-size:12px;color:var(--ink2)}
.sub{font-size:11px;color:var(--ink3)}
.val{font-size:17px;font-weight:700;margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec{font-size:14px;font-weight:700;margin:4px 2px 0}
.prog{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:10px 0 8px}
.prog>div{height:100%;background:var(--ink);border-radius:6px;transition:width .3s}
.rbtn{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card)}
.rbtn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.rbtn .ic{transition:transform .2s}
.rbtn.open .ic{transform:rotate(180deg)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:18px;background:var(--ink);color:#fff;font-size:12px;font-weight:600}
.pill{font-size:11px;padding:3px 8px;border-radius:12px;white-space:nowrap;font-weight:600}
.up{background:var(--greenbg);color:var(--green)}
.dn{background:var(--redbg);color:var(--red)}
.cmp{display:flex;justify-content:space-between;font-size:11px;margin-top:3px}
.cmp span:first-child{color:var(--ink2)}
.cg{color:var(--green);font-weight:600}.cr{color:var(--red);font-weight:600}.cn{color:var(--ink3)}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:2px}
.seg button{padding:5px 11px;font-size:11px;border-radius:14px;color:var(--ink2);font-weight:600}
.seg button.on{background:var(--ink);color:#fff}
.btn{padding:14px 0;border-radius:24px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;width:100%}
.btn:disabled{opacity:.5}
.btn2{padding:11px 0;border-radius:22px;border:1px solid #cfcfd5;background:var(--card);font-size:13px;font-weight:600;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn2.danger{color:var(--red)}
.btn2.dark{background:var(--ink);color:#fff;border-color:var(--ink)}

<script>
// =====================================================
// KONEKSI KE APPS SCRIPT
// =====================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbzwK1ZtcSIS3JUX3_5uyziyziHWqdFtNQfk1Xy0F5ECrzGd-BSVCERH3ycOTpCVrwiD/exec';

(function readKeyFromUrl(){
  try{
    const k=(new URLSearchParams(location.search).get('k')||'').trim();
    if(k){localStorage.setItem('jstore_api_key',k);sessionStorage.setItem('jstore_api_key',k);}
  }catch(e){}
})();

function getApiKey(){
  try{
    return (new URLSearchParams(location.search).get('k')||'').trim()||
      localStorage.getItem('jstore_api_key')||sessionStorage.getItem('jstore_api_key')||'';
  }catch(e){return '';}
}
function showKeyBox(m){$('keyBox').classList.remove('hide');$('keyMessage').textContent=m||'';}
function saveApiKey(){
  const k=$('keyInput').value.trim();
  if(!k){showKeyBox('Kunci belum diisi.');return;}
  try{localStorage.setItem('jstore_api_key',k);}catch(e){}
  $('keyInput').value='';$('keyBox').classList.add('hide');showStatus('');refresh();
}
function resetApiKey(){try{localStorage.removeItem('jstore_api_key');sessionStorage.removeItem('jstore_api_key');}catch(e){}showKeyBox('');window.scrollTo({top:0,behavior:'smooth'});}
function showStatus(t){const el=$('statusBar');el.textContent=t;el.classList.toggle('hide',!t);}

function callApi(action,args){
  const key=getApiKey();
  if(!key){showKeyBox('');return Promise.reject(new Error('Masukkan kunci akses dulu.'));}
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:action,args:args||[],key:key})})
    .catch(()=>{throw new Error('Tidak bisa terhubung ke server. Cek internet.');})
    .then(r=>r.text())
    .then(t=>{
      let r;try{r=JSON.parse(t);}catch(e){throw new Error('Server tidak membalas JSON. Pastikan Code.gs terbaru sudah di-Deploy (New version).');}
      if(!r.ok){
        if(r.error==='Kunci akses salah.'){try{localStorage.removeItem('jstore_api_key');}catch(e){}showKeyBox('Kunci akses salah. Coba lagi.');}
        throw new Error(r.error||'Terjadi kesalahan server.');
      }
      return r.data;
    });
}

// Cache: tampilkan data terakhir dulu (instan), lalu perbarui dari server
const MEM={};
function ck(a,args){return 'jst2:'+a+':'+JSON.stringify(args);}
function getCached(a,args){const k=ck(a,args);if(MEM[k])return MEM[k];try{const v=JSON.parse(localStorage.getItem(k)||'null');if(v)MEM[k]=v;return v;}catch(e){return null;}}
function setCached(a,args,v){const k=ck(a,args);MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function load(a,args,cb){
  const c=getCached(a,args);if(c)cb(c,true);
  return callApi(a,args).then(d=>{setCached(a,args,d);showStatus('');cb(d,false);return d;})
    .catch(e=>{if(e.message!=='Masukkan kunci akses dulu.')showStatus('⚠️ '+e.message);});
}

  kasir:'<path d="M3 20h18"/><path d="M5 20l1.4-7h11.2l1.4 7"/><path d="M9 13V9h6v4"/><rect x="7" y="4" width="10" height="5" rx="1"/><path d="M9 16.5h.01M12 16.5h.01M15 16.5h.01"/>',
  db:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',

  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>',
  target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".5"/>',
  bars:'<path d="M5 20V10M12 20V4M19 20v-7"/>',

};
const ic=n=>'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+P[n]+'</svg>';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp'+Math.round(Math.abs(n||0)).toLocaleString('id-ID');
const rpj=n=>{const v=(n||0)/1e6;if(Math.abs(v)<1)return (v<0?'-':'')+'Rp'+Math.round(Math.abs(n||0)/1e3)+'rb';return (v<0?'-':'')+'Rp'+Math.abs(v).toLocaleString('id-ID',{maximumFractionDigits:Math.abs(v)>=10?1:2})+'jt';};
const short=n=>{const a=Math.abs(n||0),s=n<0?'-':'';if(a>=1e6)return s+(a/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+'jt';if(a>=1e3)return s+Math.round(a/1e3)+'rb';return s+Math.round(a);};
const lblJ=n=>{const a=Math.abs(n||0),s=n<0?'-':'';if(a>=1e6)return s+(a/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+'jt';return s+Math.round(a/1e3)+'rb';};
const pctTxt=v=>Number(v||0).toFixed(1).replace('.',',')+'%';
// Angka bisa berupa hitungan: "1.000.000 + 200.000 - 50.000" -> 1.150.000
const hasOp=v=>/\d\s*[+\-]\s*\d?/.test(String(v==null?'':v).replace(/^\s*-/,''));
const parseAmount=v=>{
  const s=String(v==null?'':v).replace(/[^\d+\-]/g,'');
  if(!/\d[+\-]/.test(s)){const d=s.replace(/\D/g,'');return d?Number(d):0;}
  let t=0;(s.match(/[+\-]?\d+/g)||[]).forEach(x=>t+=Number(x));return Math.max(0,t);
};
const fmtExpr=v=>String(v).replace(/[^\d+\-]/g,'').split(/([+\-])/).map(x=>x==='+'||x==='-'?' '+x+' ':(x?Number(x).toLocaleString('id-ID'):'')).join('');
const fmtIn=n=>n?Number(n).toLocaleString('id-ID'):'';
const MN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MF=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const HF=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const mLabel=m=>MN[+m.slice(5,7)-1]+' '+m.slice(0,4);
const mLong=m=>MF[+m.slice(5,7)-1]+' '+m.slice(0,4);
function shiftMonth(m,d){const y=+m.slice(0,4),mo=+m.slice(5,7)-1+d;const dt=new Date(y,mo,1);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');}
function addDays(key,d){const p=key.split('-').map(Number);const dt=new Date(p[0],p[1]-1,p[2]+d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function dow(key){const p=key.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).getDay();}
function pct(a,b){if(!b||b<=0)return null;return Math.round((a-b)/b*100);}
function pctSpan(p,cls){if(p===null)return '<span class="cn">–</span>';return '<span class="'+(cls?(p>=0?'pill up':'pill dn'):(p>=0?'cg':'cr'))+'">'+(p>=0?'▲ ':'▼ ')+Math.abs(p)+'%</span>';}
function jakartaToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}

// Kolom angka: nol hilang saat diketik, format ribuan otomatis
// Rumus disimpan di data-f: saat kolom diketuk lagi, rumusnya muncul untuk dikoreksi
function bindNum(el,onChange,noMini){
  el.addEventListener('focus',()=>{
    if(el.dataset.f)el.value=el.dataset.f;
    else if(parseAmount(el.value)===0)el.value='';
  });
  el.addEventListener('input',()=>{
    const v=el.value;
    el.value=/[+\-]/.test(v.replace(/^\s*-/,''))?fmtExpr(v):fmtIn(parseAmount(v));
    if(onChange)onChange();
  });
  // saat pindah kolom / Enter: hitungan langsung dijumlahkan
  el.addEventListener('blur',()=>{
    el.dataset.f=hasOp(el.value)?fmtExpr(el.value).trim().replace(/\s*[+\-]\s*$/,''):'';
    el.value=fmtIn(parseAmount(el.value))||'0';if(onChange)onChange();
  });
  const box=noMini?null:el.closest('.fld,.trx');
  if(box&&!box.querySelector('.mini')){
    const b=document.createElement('button');b.type='button';b.className='mini';b.textContent='+';b.setAttribute('aria-label','Tambah');
    b.addEventListener('pointerdown',e=>e.preventDefault());
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.addEventListener('click',e=>{e.preventDefault();addOpEl(el,'+');});
    box.appendChild(b);
  }
}
function fOf(el){if(!el)return '';return hasOp(el.value)?fmtExpr(el.value).trim():(el.dataset.f||'');}
function setNum(el,val,f){if(!el)return;el.value=f||fmtIn(val)||'0';el.dataset.f=f||'';}
function addOp(id,op){addOpEl($(id),op);}
function addOpEl(el,op){
  if(!el)return;
  if(document.activeElement!==el)el.focus();
  let v=el.value.replace(/\s*[+\-]\s*$/,'');
  if(!parseAmount(v)&&!hasOp(v))return;
  el.value=v+' '+op+' ';
  el.dispatchEvent(new Event('input'));
  try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}
}

function sumTo(m,lim){let o=0,n=0;(m.days||[]).forEach(x=>{if(x.has&&x.day<=lim){o+=x.omzet;n+=x.net;}});return {o:o,n:n};}

function renderDash(d){
  S.dash=d;
  const c=d.cur,t=c.toko,tg=c.target;
  const isCur=c.month===S.today.slice(0,7);
  const todayD=+S.today.slice(8,10);
  const lastDay=isCur?todayD:c.daysInMonth;
  const cmp=o=>{if(!o)return {o:null,n:null};const lim=isCur?Math.min(todayD,o.daysInMonth):o.daysInMonth;const a=sumTo(c,lastDay),b=sumTo(o,lim);
    // ★ tidak punya tanggal: dihitung penuh untuk bulan masing-masing
    a.o+=c.luar.omzet;a.n+=c.luar.net;b.o+=(o.luar?o.luar.omzet:0);b.n+=(o.luar?o.luar.net:0);
    return {o:pct(a.o,b.o),n:pct(a.n,b.n)};};
  const L=c.luar,allO=t.omzet+L.omzet,allN=t.net+L.net;
  const starNote=L.omzet?'<div class="sub" style="margin-top:2px">termasuk '+ic('star')+' '+rpj(L.omzet)+'</div>':'';
  const starNoteN=L.omzet?'<div class="sub" style="margin-top:2px">termasuk '+ic('star')+' '+rpj(L.net)+'</div>':'';

  // achievement = (omzet toko + ★) ÷ target sebulan

  const remain=isCur?Math.max(0,c.daysInMonth-todayD+1):(c.month>S.today.slice(0,7)?c.daysInMonth:0);
  const above=c.days.filter(x=>x.has&&x.omzet>=tg.daily).length;
  let rec1;
  if(left<=0)rec1='Target bulan ini <b>sudah tercapai</b>'+(allO>tg.monthly?', lebih <b>'+rp(allO-tg.monthly)+'</b>':'')+'. Pertahankan!';
  else if(remain>0)rec1='Kurang <b>'+rp(left)+'</b> lagi. Butuh rata-rata <b>'+rp(left/remain)+'/hari</b> di '+remain+' hari tersisa.';
  else rec1='Bulan ini sudah selesai, kurang <b>'+rp(left)+'</b> dari target.';

  const vals=c.days.map(x=>x.has?(mode==='o'?x.omzet:x.net):0);

  });
  let info='';
  if(S.dashSel){const x=c.days[S.dashSel-1];info='<div class="infoline" style="flex-wrap:wrap"><span>'+HF[dow(x.date)]+', '+x.day+' '+MN[+c.month.slice(5,7)-1]+'</span><b>'+(x.has?rp(mode==='o'?x.omzet:x.net):'belum ada data')+'</b>'+(x.note?'<div style="flex-basis:100%;color:var(--ink2)">'+ic('edit')+' '+esc(x.note)+'</div>':'')+'</div>';}
  const starList=S.starOpen?'<div class="infoline" style="display:block"><div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px"><span>'+ic('star')+' Luar toko · '+MN[+c.month.slice(5,7)-1]+'</span><span>'+rp(c.luar.omzet)+'</span></div>'+
    (c.luar.entries.length?c.luar.entries.map(e=>'<div style="display:flex;justify-content:space-between;color:var(--ink2)"><span>'+esc(e.ket||'Tanpa keterangan')+'</span><span>'+rp(e.amount)+'</span></div>').join(''):'<div style="color:var(--ink3)">Belum ada pemasukan luar toko.</div>')+'</div>':'';

  // info lainnya
  const filled=c.days.filter(x=>x.has&&x.omzet>0);

        :'<div class="bigprog"><div style="width:'+w+'%;padding:0"></div><span class="out" style="left:calc('+w+'% + 12px)">'+pctTxt(ach)+'</span></div>';})()+
    '<div class="hd" style="font-size:12px;color:var(--ink2)"><span>Target '+rp(tg.daily)+'/hari</span><span><b style="color:var(--ink)">'+rp(allO)+'</b> / '+rp(tg.monthly)+'</span></div>'+
    (L.omzet?'<div class="sub" style="text-align:right;margin-top:-4px">termasuk '+ic('star')+' '+rpj(L.omzet)+'</div>':'')+
    (S.recOpen?

  '</div>'+

function dashPick(d){S.dashSel=S.dashSel===d?null:d;renderDash(S.dash);}
function saveTarget(){
  const v=parseAmount($('tgtIn').value);
  if(!v){alert('Isi target terlebih dahulu.');return;}
  const b=$('tgtSave');b.disabled=true;b.textContent='Menyimpan...';
  callApi('setTarget',[S.branch,S.dash.cur.month,v]).then(()=>{S.tgtOpen=false;refresh();})

function stripDays(){
  let end=S.today;
  if(S.inDate<addDays(S.today,-6))end=addDays(S.inDate,3)>S.today?S.today:addDays(S.inDate,3);
  const out=[];for(let i=6;i>=0;i--)out.push(addDays(end,-i));return out;
}
function monthOf(key){return S.months[S.branch+'|'+key.slice(0,7)];}
function dayData(key){const m=monthOf(key);if(!m)return null;return m.days[+key.slice(8,10)-1]||null;}

function buildInput(){
  const toko=S.inMode==='toko';
  $('pInput').innerHTML=
  '<div style="display:flex;flex-direction:column;gap:12px">'+
  '<div class="tabs"><button class="'+(toko?'on':'')+'" onclick="setInMode(\'toko\')" aria-label="Toko">'+ic('store')+'</button>'+
    '<button class="'+(toko?'':'on')+'" onclick="setInMode(\'luar\')" aria-label="Luar toko">'+ic('star')+'</button></div>'+
  (toko?'<div class="strip" id="strip"></div><div id="dayLabel" style="text-align:center;font-size:13px;font-weight:700"></div>':'')+
  '<div class="bigbox"><div class="lbl">'+(toko?'Omzet':ic('star')+' Pemasukan luar toko · '+mLong(S.luarMonth))+'</div>'+
    '<div class="bigin"><span>Rp</span><input id="inOmz" inputmode="decimal" value="0" aria-label="Nominal" enterkeyhint="next"></div>'+
    '<div class="calcrow"><div class="calc" id="omzCalc"></div>'+
    '<div class="opk"><button type="button" onpointerdown="event.preventDefault()" onclick="addOp(\'inOmz\',\'-\')" aria-label="Kurang">−</button><button type="button" onpointerdown="event.preventDefault()" onclick="addOp(\'inOmz\',\'+\')" aria-label="Tambah">+</button></div></div></div>'+
  (toko?'':'<label class="fld"><small>Keterangan</small><input id="inKet" placeholder="Pesanan online" enterkeyhint="next" maxlength="120"></label>')+
  '<div class="fgrid" style="'+(toko?'':'grid-template-columns:repeat(3,minmax(0,1fr))')+'">'+
    '<label class="fld"><small>Diskon</small><input id="inDis" inputmode="decimal" value="0" enterkeyhint="next"></label>'+
    '<label class="fld"><small>Bonus</small><input id="inBon" inputmode="decimal" value="0" enterkeyhint="next"></label>'+
    '<label class="fld"><small>Peng.</small><input id="inExp" inputmode="decimal" value="0" enterkeyhint="'+(toko?'next':'done')+'"></label>'+
    (toko?'<div class="fld"><small>Emp</small><div class="stp"><button onclick="stepEmp(-1)" aria-label="Kurangi">−</button><b id="empV">'+S.emp+'</b><button onclick="stepEmp(1)" aria-label="Tambah">+</button></div></div>':'')+
  '</div>'+
  (toko?'<label class="fld"><small>'+ic('edit')+' Catatan <span style="color:var(--ink3)">(opsional)</span></small><input id="inNote" maxlength="200" placeholder="Contoh: hujan, toko sepi" enterkeyhint="done"></label>':'')+
  '<div class="card bd prev">'+
    '<div class="lbl" style="margin-bottom:8px">'+ic('eye')+' Pratinjau</div>'+
    '<div class="r"><span>Profit (35%)</span><span id="pvPro">Rp0</span></div>'+
    '<div class="r"><span>Potongan</span><span id="pvPot">− Rp0</span></div>'+
    '<div class="t"><span>Net profit</span><span id="pvNet">Rp0</span></div>'+
    (toko?'<div class="prog" style="height:6px;margin:6px 0 4px"><div id="pvBar" style="width:0%"></div></div><div class="sub" id="pvAch"></div>':'')+
  '</div>'+
  '<button class="btn" id="saveBtn" onclick="saveInput()">SIMPAN</button>'+
  '<div class="msg" id="inMsg"></div>'+
  '<div class="card"><div class="lbl" id="listTitle" style="margin-bottom:4px"></div><div id="inList"></div></div>'+
  '</div>';

  ['inOmz','inDis','inBon','inExp'].forEach(id=>bindNum($(id),updatePreview,id==='inOmz'));
  const order=toko?['inOmz','inDis','inBon','inExp','inNote']:['inOmz','inKet','inDis','inBon','inExp'];
  order.forEach((id,i)=>$(id).addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;e.preventDefault();
    if(i<order.length-1)$(order[i+1]).focus();else saveInput();
  }));
  updateInputData();
}
function setInMode(m){S.inMode=m;buildInput();refresh();}
function pickDate(v){if(!v)return;if(v>S.today)v=S.today;S.inDate=v;S.empTouched=false;buildInput();refresh();}
function selectDay(k){S.inDate=k;S.empTouched=false;updateInputData();renderTop();loadInputData(S.tok);}
function stepEmp(d){S.emp=Math.max(0,S.emp+d);S.empTouched=true;$('empV').textContent=S.emp;}

function loadInputData(tok){
  const months=S.inMode==='toko'?[...new Set(stripDays().concat([S.inDate]).map(k=>k.slice(0,7)))]:[S.luarMonth];
  months.forEach(m=>load('getMonth',[S.branch,m],d=>{S.months[S.branch+'|'+m]=d;if(tok===S.tok&&S.page==='input')updateInputData();}));
}

function updatePreview(){
  if(!$('inOmz'))return;
  $('inOmz').classList.toggle('expr',hasOp($('inOmz').value));
  const o=parseAmount($('inOmz').value),pot=parseAmount($('inDis').value)+parseAmount($('inBon').value)+parseAmount($('inExp').value),p=o*0.35;
  $('pvPro').textContent=rp(p);$('pvPot').textContent='− '+rp(pot);$('pvNet').textContent=rp(p-pot);
  if($('pvAch')){
    const m=monthOf(S.inDate),daily=m?m.target.daily:(S.branch==='Blok F'?1200000:750000);
    const a=daily?Math.round(o/daily*100):0;
    $('pvAch').textContent=a+'% dari target harian '+rp(daily);$('pvBar').style.width=Math.min(100,a)+'%';
  }
}

function updateInputData(){
  if(!$('inList'))return;
  if(S.inMode==='toko'){
    const strip=stripDays();
    $('strip').innerHTML=strip.map(k=>{const x=dayData(k);return '<button class="dc'+(k===S.inDate?' on':'')+'" onclick="selectDay(\''+k+'\')">'+HS[dow(k)]+'<b>'+(+k.slice(8,10))+'</b><i class="'+(x&&x.has?'':'no')+'"></i></button>';}).join('');
    $('dayLabel').textContent=HF[dow(S.inDate)]+', '+(+S.inDate.slice(8,10))+' '+MF[+S.inDate.slice(5,7)-1]+' '+S.inDate.slice(0,4)+(S.inDate===S.today?' · hari ini':'');
    const x=dayData(S.inDate);
    if(!S.empTouched){S.emp=x?x.emp||0:0;if($('empV'))$('empV').textContent=S.emp;}
    const isToday=S.inDate===S.today;
    $('listTitle').innerHTML=isToday?'Tercatat hari ini':'Tercatat di tanggal ini · edit lewat Database '+ic('lock');
    let h='';
    if(!x||!x.has){h='<div class="sub" style="padding:6px 0">Belum ada transaksi.</div>'+(x&&x.note?'<div style="font-size:12px;padding-top:4px">'+ic('edit')+' '+esc(x.note)+'</div>':'');}
    else{
      x.incomes.forEach((it,i)=>{
        h+='<div class="row"><span class="badge">'+(i+1)+'</span><span style="flex:1">'+rp(it.amount)+(it.f?' <span class="sub">('+esc(it.f)+')</span>':'')+'</span>'+
          (isToday?'<button class="iconbtn" data-id="'+esc(it.id)+'" data-a="'+it.amount+'" data-f="'+esc(it.f||'')+'" onclick="editIncome(this)" aria-label="Edit">'+ic('edit')+'</button><button class="iconbtn red" onclick="delIncome(\''+it.id+'\')" aria-label="Hapus">'+ic('trash')+'</button>':'<span class="sub">'+ic('lock')+'</span>')+'</div>';
      });
      const fx=(v,f)=>rp(v)+(f?' ('+esc(f)+')':'');
      h+='<div class="sub" style="padding-top:8px">Diskon '+fx(x.discount,x.discountF)+' · Bonus '+fx(x.bonus,x.bonusF)+' · Peng. '+fx(x.expense,x.expenseF)+' · Emp '+(x.emp||0)+'</div>';
      if(x.note)h+='<div style="font-size:12px;padding-top:6px">'+ic('edit')+' '+esc(x.note)+'</div>';
    }
    $('inList').innerHTML=h;
  }else{
    const m=monthOf(S.luarMonth+'-01');
    const L=m?m.luar:{entries:[],omzet:0};
    $('listTitle').innerHTML='Luar toko '+mLong(S.luarMonth)+' · <b style="color:var(--ink)">'+rp(L.omzet)+'</b> · edit lewat Database';
    $('inList').innerHTML=L.entries.length?L.entries.map(e=>'<div class="row"><span class="badge">'+ic('star')+'</span><span style="flex:1">'+rp(e.amount)+' <span class="sub">· '+esc(e.ket||'Tanpa keterangan')+'</span></span><span class="sub">'+ic('lock')+'</span></div>').join(''):'<div class="sub" style="padding:6px 0">Belum ada pemasukan luar toko bulan ini.</div>';
  }
  updatePreview();
}

function inMsg(t,ok){const el=$('inMsg');el.textContent=t;el.className='msg '+(ok?'ok':'err');if(ok)setTimeout(()=>{if(el.textContent===t)el.textContent='';},2500);}

function saveInput(){
  const btn=$('saveBtn');if(btn.disabled)return;
  const amt=parseAmount($('inOmz').value),dis=parseAmount($('inDis').value),bon=parseAmount($('inBon').value),exp=parseAmount($('inExp').value);
  let action,args;
  if(S.inMode==='toko'){
    const x=dayData(S.inDate);
    const empChanged=S.empTouched&&(!x||S.emp!==(x.emp||0));
    const note=($('inNote')?$('inNote').value:'').trim();
    if(!amt&&!dis&&!bon&&!exp&&!empChanged&&!note){inMsg('Masukkan nominal terlebih dahulu.');return;}
    action='saveDaily';args=[{branch:S.branch,date:S.inDate,amount:amt,discount:dis,bonus:bon,expense:exp,emp:S.empTouched?S.emp:null,note:note,
      amountF:fOf($('inOmz')),discountF:fOf($('inDis')),bonusF:fOf($('inBon')),expenseF:fOf($('inExp'))}];
  }else{
    if(!amt){inMsg('Isi nominal luar toko terlebih dahulu.');return;}
    action='addLuar';args=[{branch:S.branch,month:S.luarMonth,ket:$('inKet').value.trim(),amount:amt,discount:dis,bonus:bon,expense:exp}];
  }
  btn.disabled=true;btn.textContent='MENYIMPAN...';
  callApi(action,args).then(()=>{
    ['inOmz','inDis','inBon','inExp'].forEach(id=>{$(id).value='0';$(id).dataset.f='';$(id).classList.remove('expr');});
    if($('inKet'))$('inKet').value='';
    if($('inNote'))$('inNote').value='';
    S.empTouched=false;
    updatePreview();inMsg('✓ Tersimpan',true);
    $('inOmz').focus();
    loadInputData(S.tok);
  }).catch(e=>inMsg(e.message)).finally(()=>{btn.disabled=false;btn.textContent='SIMPAN';});
}
function editIncome(btn){
  const id=btn.dataset.id,amount=+btn.dataset.a,f=btn.dataset.f;
  const v=prompt('Ubah nominal transaksi (boleh pakai +):',f||fmtIn(amount));
  if(v===null)return;
  const n=parseAmount(v);
  callApi('updateIncome',[id,n,hasOp(v)?fmtExpr(v).trim():'']).then(()=>{inMsg('✓ Transaksi diperbarui',true);loadInputData(S.tok);}).catch(e=>alert(e.message));
}
function delIncome(id){
  if(!confirm('Hapus transaksi ini?'))return;
  callApi('deleteIncome',[id]).then(()=>{inMsg('✓ Transaksi dihapus',true);loadInputData(S.tok);}).catch(e=>alert(e.message));
}

  rows+='<tr class="tot"><td class="s1" colspan="2" style="background:var(--ink);color:#fff;text-align:left">Total</td><td>'+rp(t.omzet+L.omzet)+'</td><td>'+rp(t.profit+L.profit)+'</td><td>'+rp(t.modal+L.modal)+'</td><td>'+rp(t.discount+L.discount)+'</td><td>'+pctTxt(t.achievement)+'</td><td>'+rp(t.expense+L.expense)+'</td><td class="c">'+(t.empAvg||0).toFixed(1).replace('.',',')+'</td><td>'+rp(t.bonus+L.bonus)+'</td><td>'+rp(t.net+L.net)+'</td><td></td><td class="pc"></td></tr>';

  const el=$('dbTable');

    '<button class="ebtn" onclick="toggleDbEdit()">'+(S.dbEdit?ic('check')+' Selesai':ic('edit')+' Edit')+'</button></div>'+
    '<div class="tw"><table class="tt"><thead><tr><th class="s1">Tgl</th><th class="s2">Hari</th><th>Omzet</th><th>Profit</th><th>Modal</th><th>Diskon</th><th>Ach.</th><th>Pengeluaran</th><th class="c">Emp</th><th>Bonus</th><th>Net profit</th><th style="text-align:left">Catatan</th><th class="pc"></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div id="dbPanel"></div>';
  el.querySelectorAll('tr[data-k]').forEach(tr=>tr.onclick=()=>{if(!S.dbEdit)return;S.dbSel=tr.dataset.k;renderDbTable();});

function toggleDbEdit(){S.dbEdit=!S.dbEdit;if(!S.dbEdit)S.dbSel=null;renderDbTable();}

      (E.length?E.map(e=>'<div class="lcard" data-id="'+e.id+'">'+
        '<div class="grid2" style="gap:6px"><label class="fld soft"><small>Nominal</small><input class="ln" inputmode="numeric" value="'+fmtIn(e.amount)+'"></label><label class="fld soft"><small>Keterangan</small><input class="lk" value="'+esc(e.ket)+'" maxlength="120"></label></div>'+
        '<div class="grid3" style="gap:6px;margin-top:6px"><label class="fld soft"><small>Diskon</small><input class="ld" inputmode="numeric" value="'+(fmtIn(e.discount)||'0')+'"></label><label class="fld soft"><small>Bonus</small><input class="lb" inputmode="numeric" value="'+(fmtIn(e.bonus)||'0')+'"></label><label class="fld soft"><small>Peng.</small><input class="le" inputmode="numeric" value="'+(fmtIn(e.expense)||'0')+'"></label></div>'+
        '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn2 danger" onclick="delLuar(\''+e.id+'\')">'+ic('trash')+' Hapus</button><button class="btn2 dark" onclick="saveLuar(this,\''+e.id+'\')">'+ic('check')+' Simpan</button></div></div>').join('')
      :'<div class="sub" style="padding:8px 0">Belum ada pemasukan luar toko bulan ini. Tambahkan lewat halaman Input (tab ★).</div>')+

function addTrxRow(){
  const l=$('trxList');const n=l.children.length+1;
  l.insertAdjacentHTML('beforeend','<div class="trx" data-id=""><span class="badge">'+n+'</span><input inputmode="numeric" value="0"><button class="iconbtn red" onclick="this.parentNode.remove()" aria-label="Hapus transaksi">'+ic('trash')+'</button></div>');
  bindNum(l.lastElementChild.querySelector('input'));
}
function pdEmp(d){const e=$('pdEmp');e.textContent=Math.max(0,+e.textContent+d);}
function closePanel(){S.dbSel=null;renderDbTable();}
function afterDbSave(){S.dbSel=null;refresh();}
function saveDay(){
  const incomes=[...document.querySelectorAll('#trxList .trx')].map(r=>{const i=r.querySelector('input');return {id:r.dataset.id,amount:parseAmount(i.value),f:fOf(i)};});
  const b=$('pdSave');b.disabled=true;
  callApi('updateDay',[{branch:S.branch,date:S.dbSel,incomes:incomes,discount:parseAmount($('pdDis').value),bonus:parseAmount($('pdBon').value),expense:parseAmount($('pdExp').value),emp:+$('pdEmp').textContent,note:$('pdNote').value.trim(),
    discountF:fOf($('pdDis')),bonusF:fOf($('pdBon')),expenseF:fOf($('pdExp'))}])
    .then(afterDbSave).catch(e=>{alert(e.message);b.disabled=false;});
}
function delDay(){
  if(!confirm('Hapus semua data tanggal ini?'))return;
  callApi('deleteDay',[S.branch,S.dbSel]).then(afterDbSave).catch(e=>alert(e.message));

// Format CSV: tanggal, omzet, diskon, bonus, pengeluaran, (emp opsional)
// Pemisah koma atau titik koma; angka boleh pakai titik ribuan; tanggal yyyy-mm-dd atau dd/mm/yyyy
function importCsv(input){
  const f=input.files&&input.files[0];if(!f)return;
  const msg=$('impMsg');msg.className='msg';msg.textContent='Membaca file...';
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const lines=String(ev.target.result||'').replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
      if(lines.length<2)throw new Error('File CSV tidak berisi data.');
      const sep=(lines[0].split(';').length>lines[0].split(',').length)?';':',';
      const records=[];
      lines.slice(1).forEach((line,i)=>{
        const c=line.split(sep).map(v=>v.trim().replace(/^"|"$/g,''));
        if(c.length<2)throw new Error('Format baris '+(i+2)+' tidak sesuai.');
        let d=c[0];
        const m1=d.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
        if(m1)d=m1[3]+'-'+m1[2].padStart(2,'0')+'-'+m1[1].padStart(2,'0');
        if(!/^\d{4}-\d{2}-\d{2}$/.test(d))throw new Error('Tanggal tidak valid di baris '+(i+2)+'.');
        const n=k=>parseAmount(c[k]);
        records.push({date:d,omzet:n(1),discount:n(2),bonus:n(3),expense:n(4),emp:n(5)});
      });
      msg.textContent='Mengimpor '+records.length+' baris...';
      callApi('importHistoricalData',[{branch:S.branch,records:records}]).then(res=>{
        msg.className='msg ok';msg.textContent='Selesai: '+res.imported+' hari masuk, '+res.skipped+' dilewati (sudah ada / tidak valid).';
        refresh();
      }).catch(e=>{msg.className='msg err';msg.textContent=e.message;});
    }catch(e){msg.className='msg err';msg.textContent=e.message;}
    input.value='';
  };
  r.onerror=()=>{msg.className='msg err';msg.textContent='Gagal membaca file.';};
  r.readAsText(f,'UTF-8');
}

// =====================================================
// IMPORT EXCEL (.xlsx) — format laporan bulanan per tab
// Tab = nama bulan; kolom dicari dari judul: TANGGAL, HIJAB/OMZET, DISKON,
// PENGELUARAN, KARYAWAN, BONUS. Baris tanpa tanggal setelah tanggal terakhir = ★.
// =====================================================
function importFile(input){
  const f=input.files&&input.files[0];if(!f)return;
  if(/\.xlsx$/i.test(f.name)){
    const msg=$('impMsg');msg.className='msg';msg.textContent='Membaca file Excel...';
    f.arrayBuffer().then(buf=>readXlsx(buf)).then(sheets=>{
      const p=parseSalesBook(sheets,f.name);
      if(!p.months.length)throw new Error('Tidak ada tab bulan (JANUARI–DESEMBER) dengan format yang dikenali.');
      IMP=p;msg.textContent='';renderImport();
    }).catch(e=>{msg.className='msg err';msg.textContent=e.message||'File tidak bisa dibaca.';}).finally(()=>{input.value='';});
  }else importCsv(input);
}

async function readXlsx(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),td=new TextDecoder();
  let e=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error('File bukan Excel (.xlsx) yang valid.');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let k=0;k<n;k++){
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    files[td.decode(u8.subarray(p+46,p+46+nl))]={method,csize,off};p+=46+nl+xl+cl;
  }
  const read=async name=>{
    const f=files[name];if(!f)return null;
    const s=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true),data=u8.subarray(s,s+f.csize);
    if(f.method===0)return td.decode(data);
    if(typeof DecompressionStream==='undefined')throw new Error('Browser ini belum mendukung baca Excel. Perbarui iPadOS/Safari, atau pakai CSV.');
    return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
  const xml=t=>new DOMParser().parseFromString(t,'application/xml');
  const byTag=(d,t)=>Array.from(d.getElementsByTagNameNS('*',t));
  const ss=[];const sst=await read('xl/sharedStrings.xml');
  if(sst)byTag(xml(sst),'si').forEach(si=>ss.push(byTag(si,'t').map(t=>t.textContent).join('')));
  const wb=xml(await read('xl/workbook.xml')),rels=xml(await read('xl/_rels/workbook.xml.rels'));
  const relMap={};byTag(rels,'Relationship').forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const colIdx=ref=>{let c=0;for(const ch of ref.replace(/\d+/g,''))c=c*26+(ch.charCodeAt(0)-64);return c-1;};
  const out=[];
  for(const sh of byTag(wb,'sheet')){
    const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let tgt=relMap[rid];if(!tgt)continue;
    tgt=tgt.startsWith('/')?tgt.slice(1):'xl/'+tgt.replace(/^\.\//,'');
    const t=await read(tgt);if(!t)continue;
    const rows=[];
    byTag(xml(t),'row').forEach(r=>{
      const ri=+r.getAttribute('r')-1,arr=[];
      byTag(r,'c').forEach(c=>{
        const ty=c.getAttribute('t'),v=byTag(c,'v')[0];let val=null;
        if(ty==='s')val=v?ss[+v.textContent]:null;
        else if(ty==='inlineStr')val=byTag(c,'t').map(x=>x.textContent).join('');
        else if(ty==='str'||ty==='e')val=v?v.textContent:null;
        else if(ty==='b')val=v?v.textContent==='1':null;
        else val=v&&v.textContent!==''?Number(v.textContent):null;
        arr[colIdx(c.getAttribute('r'))]=val;
      });
      rows[ri]=arr;
    });
    out.push({name:sh.getAttribute('name'),rows:rows});
  }
  return out;
}

const MONTH_KEYS=[['JANUARI','JAN'],['FEBRUARI','FEB','PEBRUARI'],['MARET','MAR'],['APRIL','APR'],['MEI'],['JUNI','JUN'],['JULI','JUL'],['AGUSTUS','AGUS','AGU','AGT'],['SEPTEMBER','SEPT','SEP'],['OKTOBER','OKT','OCT'],['NOVEMBER','NOPEMBER','NOV','NOP'],['DESEMBER','DES','DEC']];
function monthFromName(name){
  const s=String(name||'').toUpperCase().replace(/[^A-Z]/g,'');
  for(let i=0;i<12;i++)if(MONTH_KEYS[i].some(k=>s===k||(k.length>=5&&s.startsWith(k))))return i+1;
  return 0;
}
function parseSalesBook(sheets,fileName){
  const num=v=>{if(v===null||v===undefined||v==='')return 0;if(typeof v==='number')return v;return parseAmount(v);};
  const yearVotes={};const vote=s=>{const m=String(s||'').match(/20\d\d/);if(m)yearVotes[m[0]]=(yearVotes[m[0]]||0)+1;};
  vote(fileName);vote(fileName);
  const months=[];
  sheets.forEach(sh=>{
    const mo=monthFromName(sh.name);if(!mo)return;
    const R=sh.rows;let h=-1;
    for(let i=0;i<Math.min(R.length,15);i++){const r=R[i]||[];if(r.some(v=>String(v||'').trim().toUpperCase()==='TANGGAL')){h=i;break;}}
    if(h<0)return;
    for(let i=0;i<h;i++)(R[i]||[]).forEach(vote);
    // judul kolom bisa satu atau dua baris
    const up=v=>String(v==null?'':v).trim().toUpperCase();
    const len=Math.max((R[h]||[]).length,(R[h-1]||[]).length);
    const H=[];for(let c=0;c<len;c++)H.push([up((R[h-1]||[])[c]),up((R[h]||[])[c])].filter(Boolean));
    const col=(...names)=>H.findIndex(parts=>parts.some(x=>names.some(n=>x.startsWith(n))));
    const C={tgl:col('TANGGAL','TGL'),omz:col('HIJAB','OMZET','OMSET','PEMASUKAN'),dis:col('DISKON'),ach:col('ACHIEVEMENT','ACHIEVMENT'),exp:col('PENGELUARAN'),emp:col('KARYAWAN','EMP'),bon:col('BONUS'),hari:col('HARI'),net:col('NET PROFIT','NET'),note:col('CATATAN','KETERANGAN','NOTE')};
    if(C.tgl<0||C.omz<0)return;
    // catatan: kolom berjudul CATATAN/KETERANGAN, atau kolom tepat setelah NET PROFIT
    const noteCol=C.note>=0?C.note:(C.net>=0?C.net+1:Math.max(C.bon,C.exp,C.emp)+2);
    // target harian: di kolom ACHIEVEMENT, pada baris judul atau baris tepat di bawahnya
    let daily=0;
    if(C.ach>=0)for(let i=Math.max(0,h-1);i<=h+2;i++){
      const r=R[i]||[];if(typeof r[C.tgl]==='number')continue;
      const v=r[C.ach],n=typeof v==='number'?v:parseAmount(v);
      if(n>=10000){daily=n;break;}
    }
    const days=[],tail=[];let lastDay=-1;
    for(let i=h+1;i<R.length;i++){
      const r=R[i];if(!r)continue;
      const t=r[C.tgl],o=num(r[C.omz]),d=C.dis>=0?num(r[C.dis]):0,x=C.exp>=0?num(r[C.exp]):0,b=C.bon>=0?num(r[C.bon]):0,em=C.emp>=0?num(r[C.emp]):0;
      const label=String((C.hari>=0?r[C.hari]:r[0])||'').toUpperCase();
      if(typeof t==='number'&&t>=1&&t<=31&&Math.floor(t)===t){
        lastDay=i;
        const nc=r[noteCol];
        const nt=typeof nc==='string'?nc.trim():'';
        if(o>0||d>0||x>0||b>0||nt)days.push({day:t,omzet:o,discount:d,expense:x,bonus:b,emp:em,note:nt});
        continue;
      }
      if(lastDay<0||label.includes('TOTAL'))continue;
      if(o>0){const note=typeof r[noteCol]==='string'&&r[noteCol].trim()?r[noteCol]:null;tail.push({amount:o,discount:d,expense:x,bonus:b,ket:note?String(note).trim():'Luar toko'});}
    }
    // buang baris yang ternyata TOTAL (jumlahnya sama dengan jumlah semua hari)
    const sumDays=days.reduce((s,x)=>s+x.omzet,0);
    let luar=tail.filter(x=>Math.abs(x.amount-sumDays)>1000);
    const sumAll=sumDays+luar.reduce((s,x)=>s+x.amount,0);
    luar=luar.filter(x=>Math.abs(x.amount-sumAll)>1000);
    if(!days.length&&!luar.length)return;
    months.push({month:mo,sheet:sh.name,daily:daily,days:days,luar:luar});
  });
  months.sort((a,b)=>a.month-b.month);
  let year=+(Object.keys(yearVotes).sort((a,b)=>yearVotes[b]-yearVotes[a])[0]||new Date().getFullYear());
  return {year:year,months:months,useTarget:true,file:fileName};
}

let IMP=null;
function renderImport(){
  const el=$('impPanel');if(!el)return;
  if(!IMP){el.innerHTML='';return;}
  const p=IMP,y=p.year;
  let tot=0,days=0,lu=0,rows='';
  p.months.forEach(m=>{
    const so=m.days.reduce((s,x)=>s+x.omzet,0),sl=m.luar.reduce((s,x)=>s+x.amount,0);
    tot+=so;days+=m.days.length;lu+=m.luar.length;
    rows+='<tr><td>'+MF[m.month-1]+'</td><td>'+m.days.length+'</td><td>'+rpj(so)+'</td><td>'+(m.luar.length?rpj(sl):'—')+'</td><td>'+(m.daily?rpj(m.daily):'—')+'</td></tr>';
  });
  el.innerHTML='<div class="card bd np" style="margin-top:4px">'+
    '<div style="padding:12px 14px"><div class="hd"><b style="font-size:14px">'+ic('up')+' Pratinjau import</b><button class="iconbtn" onclick="IMP=null;renderImport()" aria-label="Batal">'+ic('x')+'</button></div>'+
    '<div class="sub" style="margin-top:4px">'+esc(p.file)+' → <b style="color:var(--ink)">'+S.branch+'</b></div>'+
    '<div class="hd" style="margin-top:10px"><span class="lbl">Tahun data</span><div style="display:flex;align-items:center;gap:6px"><button class="iconbtn" onclick="IMP.year--;renderImport()" aria-label="Tahun sebelumnya">'+ic('left')+'</button><b>'+y+'</b><button class="iconbtn" onclick="IMP.year++;renderImport()" aria-label="Tahun berikutnya">'+ic('right')+'</button></div></div></div>'+
    '<table class="imptbl"><thead><tr><th>Bulan</th><th>Hari</th><th>Omzet</th><th>'+ic('star')+' Luar</th><th>Target/hari</th></tr></thead><tbody>'+rows+
    '<tr><td><b>Total</b></td><td><b>'+days+'</b></td><td><b>'+rpj(tot)+'</b></td><td>'+(lu?lu+'×':'—')+'</td><td></td></tr></tbody></table>'+
    '<div style="padding:12px 14px">'+
      '<label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" '+(p.useTarget?'checked':'')+' onchange="IMP.useTarget=this.checked"> Pakai target harian dari file</label>'+
      '<div class="sub" style="margin:8px 0 10px">Tanggal yang sudah ada datanya di app akan dilewati, jadi tidak dobel. Profit, modal, achievement & net profit dihitung ulang otomatis.</div>'+
      '<div style="display:flex;gap:8px"><button class="btn2" onclick="IMP=null;renderImport()">Batal</button><button class="btn2 dark" id="impGo" onclick="runImport()">'+ic('check')+' Import ke '+S.branch+'</button></div>'+
    '</div></div>';
}
function runImport(){
  const p=IMP,y=p.year,pad=n=>String(n).padStart(2,'0');
  const records=[],luar=[],targets=[];
  p.months.forEach(m=>{
    const mk=y+'-'+pad(m.month),dim=new Date(y,m.month,0).getDate();
    m.days.forEach(d=>{if(d.day<=dim)records.push({date:mk+'-'+pad(d.day),omzet:d.omzet,discount:d.discount,bonus:d.bonus,expense:d.expense,emp:d.emp,note:d.note||''});});
    m.luar.forEach(l=>luar.push({month:mk,amount:l.amount,discount:l.discount,bonus:l.bonus,expense:l.expense,ket:l.ket}));
    if(p.useTarget&&m.daily)targets.push({month:mk,amount:Math.round(m.daily*dim)});
  });
  const b=$('impGo');b.disabled=true;b.textContent='Mengimpor...';
  const msg=$('impMsg');msg.className='msg';msg.textContent='Mengirim '+records.length+' hari ke database...';
  callApi('importHistoricalData',[{branch:S.branch,records:records,luar:luar,targets:targets}]).then(r=>{
    IMP=null;renderImport();
    msg.className='msg ok';
    msg.textContent='Selesai: '+r.imported+' hari masuk'+(r.skipped?', '+r.skipped+' dilewati (sudah ada)':'')+(r.luarImported?', '+r.luarImported+' data ★':'')+(r.targetsSet?', '+r.targetsSet+' target bulan':'')+(r.notesAdded?', '+r.notesAdded+' catatan dilengkapi':'')+'.';
    S.years={};refresh();
  }).catch(e=>{msg.className='msg err';msg.textContent=e.message;b.disabled=false;b.textContent='Import ke '+S.branch;});
}

const PK={y:0,sel:'',cb:null};
function openPicker(month,cb){PK.cb=cb;PK.sel=month;PK.y=+month.slice(0,4);renderPicker();$('ov').classList.add('show');}
function closePicker(){$('ov').classList.remove('show');}
function pkYear(d){PK.y+=d;renderPicker();}
function renderPicker(){
  $('pkY').textContent=PK.y;
  $('pkG').innerHTML=MN.map((m,i)=>{const k=PK.y+'-'+String(i+1).padStart(2,'0');return '<button class="mc glass'+(k===PK.sel?' on':'')+'" onclick="PK.sel=\''+k+'\';renderPicker()">'+m+'</button>';}).join('');
}
function pkThisMonth(){PK.sel=S.today.slice(0,7);pkChoose();}
function pkChoose(){closePicker();if(PK.cb)PK.cb(PK.sel);}

(function init(){
  S.today=jakartaToday();
  S.month=S.today.slice(0,7);S.inDate=S.today;S.luarMonth=S.month;
  const start=new Date(new Date().getFullYear(),0,0);
  qi=Math.floor((Date.now()-start)/864e5)%QUOTES.length;
  $('quote').textContent='“'+QUOTES[qi]+'”';
  $('nDash').innerHTML=ic('dash')+'Dashboard';
  $('nInput').innerHTML=ic('kasir')+'Input';
  $('nDb').innerHTML=ic('db')+'Database';
  $('pkL').innerHTML=ic('left');$('pkR').innerHTML=ic('right');
  $('keyInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveApiKey();}});
  go('dash');
})();
